عندما تكتب رسالة على هاتفك وتضغط "إرسال"، ماذا يحدث فعلاً؟ قبل أن نتعلم البرمجة أو الذكاء الاصطناعي، يجب أن نفهم الآلة التي سنتعامل معها، لأن كل برنامج ستكتبه لاحقاً سيعمل داخل هذه الآلة.

### التعريف
**الحاسوب (Computer)** آلة إلكترونية تستقبل **بيانات (Data)**، وتعالجها وفق **تعليمات (Instructions)** محددة مسبقاً، ثم تخزن النتائج أو تعرضها.

لاحظ ثلاث كلمات مهمة في التعريف:
- **إلكترونية**: تعمل بالكهرباء، وكل ما بداخلها في النهاية إشارات كهربائية.
- **تعليمات محددة مسبقاً**: الحاسوب لا "يفكر" من تلقاء نفسه؛ ينفذ بدقة ما كُتب له. هذه التعليمات المكتوبة اسمها **برنامج (Program)**، وكتابتها اسمها **البرمجة (Programming)**.
- **تعالج**: أي تحسب وتقارن وتنقل وترتب. كل ما تراه من صور وألعاب ومحادثات هو في الحقيقة عمليات حسابية سريعة جداً.

بهذا التعريف، الهاتف الذكي حاسوب، وجهاز PlayStation حاسوب، والساعة الذكية حاسوب، وحتى الغسالة الحديثة تحتوي حاسوباً صغيراً يتحكم فيها.

### الوظائف الأربع لأي حاسوب
كل حاسوب، من أصغر ساعة إلى أكبر خادم يشغّل نماذج الذكاء الاصطناعي، يقوم بأربع وظائف أساسية:

| الوظيفة | بالإنجليزية | ماذا تعني؟ | أمثلة من الأجهزة |
|---|---|---|---|
| الإدخال | Input | إدخال البيانات إلى الحاسوب | لوحة المفاتيح، الفأرة، شاشة اللمس، الكاميرا، الميكروفون |
| المعالجة | Processing | تنفيذ العمليات على البيانات | المعالج CPU، ومعالج الرسوميات GPU |
| التخزين | Storage | حفظ البيانات مؤقتاً أو بشكل دائم | الذاكرة RAM، وحدات التخزين SSD وHDD |
| الإخراج | Output | عرض النتائج للمستخدم | الشاشة، السماعات، الطابعة، الاهتزاز في الهاتف |

يسمي العلماء هذا النموذج **دورة الإدخال والمعالجة والإخراج (Input–Process–Output أو IPO)**، مع التخزين كمكان تمر به البيانات في كل مرحلة تقريباً.

### لماذا يهمك هذا كطالب ذكاء اصطناعي؟
نموذج الذكاء الاصطناعي الذي يتعرف على صورة قطة يمر بنفس الدورة تماماً: **إدخال** (الصورة)، **معالجة** (ملايين العمليات الحسابية على أرقام البكسلات)، **تخزين** (أوزان النموذج المحفوظة في الذاكرة)، **إخراج** (كلمة "قطة"). الفرق فقط في حجم العمليات. ولهذا سنفهم كل جزء من هذه الأجزاء بالتفصيل في الدروس القادمة.`,terms:[{en:"Computer",ar:"الحاسوب",def:"آلة إلكترونية تعالج البيانات وفق تعليمات."},{en:"Data",ar:"البيانات",def:"قيم خام: أرقام، نصوص، صور، أصوات."},{en:"Instruction",ar:"التعليمة",def:'أمر واحد يفهمه الحاسوب، مثل "اجمع" أو "قارن".'},{en:"Program",ar:"البرنامج",def:"مجموعة تعليمات مرتبة لتحقيق هدف."},{en:"Input / Output",ar:"الإدخال / الإخراج",def:"ما يدخل إلى الحاسوب / ما يخرج منه للمستخدم."},{en:"Processing",ar:"المعالجة",def:"تنفيذ العمليات على البيانات."},{en:"Storage",ar:"التخزين",def:"حفظ البيانات لاستخدامها لاحقاً."}],reallife:"**التصوير بالهاتف**: الكاميرا (إدخال) تلتقط الضوء وتحوله إلى أرقام، المعالج (معالجة) يحسّن الألوان ويزيل الضوضاء، الصورة تُحفظ في ذاكرة الهاتف (تخزين)، ثم تظهر في المعرض على الشاشة (إخراج). أربع وظائف في أقل من ثانية.",analogy:"فكّر في **مطعم**: الزبون يكتب طلبه (إدخال)، الطباخ يحضّر الطعام حسب الوصفة (معالجة وفق تعليمات)، الثلاجة والرفوف تحفظ المكونات (تخزين)، والنادل يقدّم الطبق (إخراج). **الوصفة هي البرنامج**: الطباخ الماهر لا يخترع؛ ينفذ الوصفة بدقة. والحاسوب أدق طباخ في العالم، لكنه لا يطبخ أي شيء بدون وصفة.",mistakes:[{t:'الاعتقاد بأن الحاسوب "يفهم" أو "يفكر" مثل الإنسان',d:"الحاسوب ينفذ تعليمات فقط. حتى أنظمة الذكاء الاصطناعي المتقدمة تنفذ عمليات حسابية تعلمت أنماطها من البيانات. سنفهم هذا بعمق في الوحدة السابعة."},{t:'الخلط بين "الحاسوب" و"الصندوق" أو "الشاشة"',d:"الشاشة جهاز إخراج فقط. الحاسوب هو مجموع الأجزاء التي تعمل معاً، والجزء المسؤول عن المعالجة هو المعالج."}],summary:["الحاسوب آلة إلكترونية تستقبل البيانات وتعالجها وفق تعليمات (برنامج) ثم تخزن النتائج أو تعرضها.","الوظائف الأربع: إدخال، معالجة، تخزين، إخراج.","الهاتف والساعة الذكية وأجهزة الألعاب كلها حواسيب.","نماذج الذكاء الاصطناعي تعمل بنفس الدورة، لكن بحجم عمليات هائل."],review:["عرّف الحاسوب بكلماتك في جملة واحدة.","صنّف هذه الأجهزة: الميكروفون، السماعة، الطابعة، شاشة اللمس. أيها جهاز إدخال وإخراج معاً؟","لماذا نقول إن الحاسوب لا يعمل بدون برنامج؟"],quiz:[{t:"mcq",q:"أي مما يلي يصف الحاسوب بدقة؟",o:["آلة تفكر وتقرر من تلقاء نفسها","آلة إلكترونية تعالج البيانات وفق تعليمات","شاشة متصلة بلوحة مفاتيح","جهاز للإنترنت فقط"],a:1,why:"الحاسوب ينفذ تعليمات (برنامجاً) على بيانات. لا يقرر من تلقاء نفسه، ولا يقتصر على شكل معين.",f:['الحاسوب لا يقرر من تلقاء نفسه؛ كل "قرار" هو تنفيذ لتعليمات كُتبت مسبقاً.',void 0,"الشاشة ولوحة المفاتيح مجرد أجهزة إدخال وإخراج.","الإنترنت استخدام واحد فقط من استخدامات الحاسوب."]},{t:"mcq",q:"الكاميرا في الهاتف تُعد جهاز:",o:["إخراج","معالجة","إدخال","تخزين"],a:2,why:"الكاميرا تُدخل الصورة إلى الحاسوب على شكل بيانات."},{t:"tf",q:"شاشة اللمس جهاز إدخال وإخراج في الوقت نفسه.",a:!0,why:"تعرض الصورة (إخراج) وتستقبل لمسات إصبعك (إدخال)."},{t:"mcq",q:"في نموذج IPO، ماذا تمثل الحرف P؟",o:["Program","Processing","Power","Printer"],a:1,why:"IPO = Input, Processing, Output."},{t:"fill",q:"مجموعة التعليمات المرتبة التي ينفذها الحاسوب تسمى ______.",a:["برنامج","البرنامج","program"],why:"البرنامج (Program) هو التعليمات المكتوبة، وكتابته هي البرمجة."}],exercise:{kind:"open",task:"افتح أي تطبيق على هاتفك (مثلاً تطبيق خرائط أو رسائل). اكتب في ورقة: ما الإدخال؟ ما المعالجة التي تتوقعها؟ ما الذي يُخزن؟ ما الإخراج؟ حاول أن تجد مثالين على الأقل لكل وظيفة.",hint:"في الخرائط: موقعك GPS وما تكتبه في البحث إدخال؛ حساب أقصر طريق معالجة.",solution:`**مثال لتطبيق الخرائط:**
- **الإدخال**: اسم المكان الذي تكتبه، وموقعك من مستشعر GPS، ولمساتك على الخريطة.
- **المعالجة**: حساب أقصر طريق بخوارزمية بحث في مخطط الطرق، وتقدير وقت الوصول.
- **التخزين**: الأماكن المحفوظة، سجل البحث، أجزاء الخريطة المحملة مؤقتاً.
- **الإخراج**: الخريطة والمسار على الشاشة، والتوجيه الصوتي من السماعة.`},sources:["cs50x"]},{id:"c2",unit:"computer",title:"العتاد والبرمجيات ونظام التشغيل",en:"Hardware, Software and the Operating System",level:1,minutes:25,prereq:["c1"],goals:["تميّز بين **العتاد (Hardware)** و**البرمجيات (Software)** بأمثلة.","تعرف أنواع البرمجيات: برمجيات النظام والبرمجيات التطبيقية.","تفهم دور **نظام التشغيل (Operating System)** ولماذا لا يعمل أي تطبيق بدونه."],body:`### جزءان لا يعمل أحدهما بدون الآخر
**العتاد (Hardware)**: كل جزء مادي في الحاسوب تستطيع لمسه: المعالج، الذاكرة، الشاشة، البطارية، لوحة المفاتيح.

**البرمجيات (Software)**: البرامج والتعليمات والبيانات المخزنة داخل الحاسوب. لا تستطيع لمسها، لكنها هي التي تخبر العتاد ماذا يفعل.

العتاد بدون برمجيات قطعة معدن صامتة. والبرمجيات بدون عتاد مجرد أفكار مكتوبة لا تجد من ينفذها.

### أنواع البرمجيات
1. **برمجيات النظام (System Software)**: تدير الجهاز نفسه. أهمها **نظام التشغيل**، ومعها **برامج التشغيل (Drivers)** التي تعلّم نظام التشغيل كيف يتعامل مع جهاز معين مثل الطابعة.
2. **البرمجيات التطبيقية (Application Software)**: تخدم المستخدم في مهمة محددة: المتصفح، Word، الألعاب، WhatsApp، والبرامج التي ستكتبها أنت.

### ما هو نظام التشغيل؟
**نظام التشغيل (Operating System – OS)** هو البرنامج الأهم في الجهاز. يعمل أول ما تشغل الحاسوب، ويبقى يعمل حتى تطفئه. أمثلة: Windows، macOS، Linux، Android، iOS.

وظائفه الرئيسية:
- **إدارة المعالج**: عشرات البرامج تعمل "في نفس الوقت"، ونظام التشغيل يوزع وقت المعالج بينها بسرعة كبيرة حتى تبدو متزامنة.
- **إدارة الذاكرة**: يعطي كل برنامج مساحته في RAM ويمنع البرامج من العبث بذاكرة بعضها.
- **إدارة الملفات**: ينظم الملفات في مجلدات ويعرف أين يقع كل ملف فعلياً على وحدة التخزين.
- **إدارة الأجهزة**: يتواصل مع لوحة المفاتيح والشاشة والطابعة عبر برامج التشغيل.
- **واجهة المستخدم**: سطح المكتب والنوافذ، أو سطر الأوامر (Terminal) الذي ستستخدمه كثيراً لاحقاً.
- **الأمان**: حسابات المستخدمين وكلمات المرور والصلاحيات.

### طبقات الحاسوب
اضغط على كل طبقة لترى دورها:

[[sim:layers]]

الفكرة المهمة: **التطبيق لا يتحدث مع العتاد مباشرة**. عندما يريد برنامجك حفظ ملف، يطلب من نظام التشغيل، ونظام التشغيل يتعامل مع وحدة التخزين. هذا يجعل البرامج أبسط: المبرمج لا يحتاج إلى معرفة نوع القرص في جهازك.

### الصلة بتخصصك
خوادم تدريب نماذج الذكاء الاصطناعي تعمل غالباً بنظام **Linux**، وستتعامل معه عبر سطر الأوامر في الوحدة التاسعة. ونماذج التعلم العميق تحتاج عتاداً خاصاً هو **معالج الرسوميات (GPU)** الذي ينفذ آلاف العمليات الحسابية بالتوازي.`,terms:[{en:"Hardware",ar:"العتاد / المكونات المادية",def:"الأجزاء المادية الملموسة."},{en:"Software",ar:"البرمجيات",def:"البرامج والتعليمات غير الملموسة."},{en:"Operating System (OS)",ar:"نظام التشغيل",def:"برنامج يدير موارد الجهاز ويخدم بقية البرامج."},{en:"Application",ar:"التطبيق",def:"برنامج يخدم المستخدم في مهمة محددة."},{en:"Driver",ar:"برنامج التشغيل (المُعرِّف)",def:"برنامج صغير يعلّم نظام التشغيل التعامل مع جهاز معين."},{en:"GPU",ar:"معالج الرسوميات",def:"معالج متخصص بالعمليات المتوازية، أساسي للتعلم العميق."}],reallife:'عندما تشتري هاتفاً جديداً: **العتاد** هو الكاميرا والشاشة والبطارية، و**نظام التشغيل** Android أو iOS، و**التطبيقات** هي ما تحمّله من المتجر. وعندما يصلك "تحديث للنظام" فهذا تغيير في البرمجيات فقط؛ الهاتف نفسه لم يتغير.',analogy:"الحاسوب كـ**شركة**: العتاد هو المبنى والمعدات، نظام التشغيل هو **المدير** الذي يوزع المكاتب (الذاكرة) والوقت (المعالج) على الموظفين، والتطبيقات هي **الموظفون** الذين يقوم كل منهم بعمل محدد. الموظف لا يكسر الجدار ليأخذ غرفة، بل يطلب من المدير.",mistakes:[{t:'اعتبار Windows "الحاسوب نفسه"',d:"Windows برنامج (نظام تشغيل)، ويمكن تثبيت Linux بدلاً منه على نفس العتاد."},{t:"الظن أن البرامج تتحكم بالعتاد مباشرة",d:"التطبيقات تطلب من نظام التشغيل، وهو الذي يتعامل مع العتاد عبر برامج التشغيل."}],summary:["العتاد ملموس، والبرمجيات تعليمات غير ملموسة، ولا يعمل أحدهما دون الآخر.","البرمجيات نوعان: برمجيات نظام وبرمجيات تطبيقية.","نظام التشغيل يدير المعالج والذاكرة والملفات والأجهزة ويقدم واجهة للمستخدم.","التطبيقات تطلب من نظام التشغيل ولا تتعامل مع العتاد مباشرة."],review:["اذكر ثلاث وظائف لنظام التشغيل.","هل المتصفح Chrome برمجيات نظام أم تطبيقية؟ ولماذا؟",'لماذا يحتاج الجهاز الجديد أحياناً إلى "تعريف" (Driver)؟'],quiz:[{t:"mcq",q:"أي مما يلي عتاد (Hardware)؟",o:["Windows","المعالج","WhatsApp","Python"],a:1,why:"المعالج جزء مادي ملموس. الباقي برمجيات."},{t:"mcq",q:"أي مما يلي نظام تشغيل؟",o:["Linux","Chrome","Excel","VS Code"],a:0,why:"Linux نظام تشغيل. Chrome وExcel وVS Code تطبيقات تعمل فوق نظام التشغيل."},{t:"tf",q:"التطبيق يكتب البيانات على وحدة التخزين مباشرة دون المرور بنظام التشغيل.",a:!1,why:"التطبيق يطلب من نظام التشغيل، وهو الذي يدير وحدة التخزين."},{t:"mcq",q:"كيف يبدو أن عدة برامج تعمل في نفس اللحظة على معالج واحد؟",o:["كل برنامج له معالج خاص دائماً","نظام التشغيل يوزع وقت المعالج بينها بسرعة كبيرة","البرامج تعمل بالتناوب كل ساعة","لا يمكن ذلك"],a:1,why:"يتنقل نظام التشغيل بين البرامج آلاف المرات في الثانية، فتبدو متزامنة. (المعالجات الحديثة متعددة الأنوية تنفذ فعلاً أكثر من برنامج معاً، لكن التوزيع يبقى مهمة نظام التشغيل.)"},{t:"fill",q:"البرنامج الصغير الذي يعلّم نظام التشغيل التعامل مع الطابعة يسمى ______ (بالإنجليزية).",a:["driver","Driver","device driver"],why:"برنامج التشغيل Driver."}],exercise:{kind:"open",task:'افتح "مدير المهام" (Task Manager) في Windows بالضغط على Ctrl + Shift + Esc، أو "مراقب النشاط" (Activity Monitor) في macOS. لاحظ: كم برنامجاً يعمل الآن؟ ما نسبة استخدام المعالج والذاكرة؟ اكتب ملاحظاتك.',solution:"ستجد عشرات العمليات (Processes) تعمل حتى لو فتحت برنامجين فقط، لأن نظام التشغيل نفسه يشغّل خدمات كثيرة في الخلفية. ستلاحظ أن المتصفح غالباً يستهلك أكبر قدر من الذاكرة RAM. هذه الأرقام هي ما يديره نظام التشغيل لحظة بلحظة."},sources:["cs50x"]},{id:"c3",unit:"computer",title:"المعالج CPU: عقل الحاسوب الحسابي",en:"The Central Processing Unit (CPU)",level:1,minutes:30,prereq:["c2"],goals:["تعرف مكونات المعالج: وحدة التحكم، وحدة الحساب والمنطق، المسجلات.","تفهم **دورة الجلب وفك الترميز والتنفيذ** خطوة بخطوة.","تفهم معنى سرعة المعالج (GHz) وعدد الأنوية (Cores)."],body:`### ما هو المعالج؟
**وحدة المعالجة المركزية (Central Processing Unit – CPU)** هي الشريحة التي تنفذ تعليمات البرامج. كل عملية جمع أو مقارنة أو نقل بيانات تمر بها. داخلها مليارات من المفاتيح الإلكترونية الصغيرة جداً اسمها **الترانزستورات (Transistors)**.

### مكونات المعالج
- **وحدة التحكم (Control Unit – CU)**: "قائد الأوركسترا". تقرأ التعليمة وتفهمها وتوجه بقية الأجزاء.
- **وحدة الحساب والمنطق (Arithmetic Logic Unit – ALU)**: تنفذ العمليات الحسابية (جمع، طرح…) والمنطقية (مقارنة: هل A أكبر من B؟).
- **المسجلات (Registers)**: خانات ذاكرة صغيرة جداً وسريعة جداً داخل المعالج نفسه، تحفظ القيم التي يعمل عليها الآن. أهمها **عداد البرنامج (Program Counter – PC)** الذي يحفظ عنوان التعليمة التالية.
- **الذاكرة المخبئية (Cache)**: ذاكرة سريعة قريبة من المعالج تحفظ البيانات المستخدمة كثيراً لتجنب انتظار RAM.

### دورة التعليمة: جلب، فك ترميز، تنفيذ
المعالج يكرر ثلاث خطوات طوال الوقت، وتسمى **دورة الجلب والتنفيذ (Fetch–Decode–Execute Cycle)**:
1. **الجلب (Fetch)**: يقرأ التعليمة التالية من الذاكرة (العنوان في PC).
2. **فك الترميز (Decode)**: وحدة التحكم تحدد ماذا تعني التعليمة.
3. **التنفيذ (Execute)**: تُنفذ العملية (غالباً في ALU)، وتُحفظ النتيجة، ويتقدم PC إلى التعليمة التالية.

شاهد المعالج ينفذ برنامجاً صغيراً يجمع 5 و3:

[[sim:cpu]]

> **تنبيه علمي**: التعليمات أعلاه مكتوبة بأسلوب مبسط يشبه **لغة التجميع (Assembly)**. المعالجات الحقيقية لها مجموعات تعليمات محددة مثل x86 وARM، وتنفذ عدة تعليمات بالتوازي بتقنيات معقدة، لكن الفكرة الأساسية هي هذه الدورة.

### ماذا تعني 3.5 GHz؟
**التردد (Clock Speed)** يقاس بالهرتز. 1 GHz = مليار دورة ساعة في الثانية. المعالج بتردد 3.5 GHz يمر بـ 3.5 مليار دورة كل ثانية. التعليمة الواحدة قد تحتاج دورة أو أكثر، والمعالجات الحديثة تنجز أحياناً عدة تعليمات في الدورة الواحدة، لذلك التردد وحده لا يحدد السرعة.

### الأنوية (Cores)
المعالج الحديث يحتوي عدة **أنوية**، كل نواة معالج شبه مستقل. معالج بثماني أنوية يستطيع تنفيذ ثمانية تدفقات من التعليمات فعلياً في الوقت نفسه.

### CPU مقابل GPU
| | CPU | GPU |
|---|---|---|
| عدد الأنوية | قليل (4 إلى 32 غالباً) | آلاف الأنوية البسيطة |
| يتفوق في | المهام المتنوعة والمتسلسلة | تكرار العملية نفسها على بيانات ضخمة بالتوازي |
| في الذكاء الاصطناعي | تشغيل البرنامج وإدارة البيانات | تدريب الشبكات العصبية (ضرب مصفوفات ضخمة) |`,terms:[{en:"CPU",ar:"وحدة المعالجة المركزية",def:"الشريحة التي تنفذ التعليمات."},{en:"ALU",ar:"وحدة الحساب والمنطق",def:"تنفذ العمليات الحسابية والمقارنات."},{en:"Control Unit",ar:"وحدة التحكم",def:"تفك ترميز التعليمات وتوجه الأجزاء."},{en:"Register",ar:"المسجل",def:"خانة تخزين صغيرة وسريعة جداً داخل المعالج."},{en:"Program Counter",ar:"عداد البرنامج",def:"مسجل يحفظ عنوان التعليمة التالية."},{en:"Fetch–Decode–Execute",ar:"جلب – فك ترميز – تنفيذ",def:"الدورة التي يكررها المعالج لكل تعليمة."},{en:"Clock Speed (GHz)",ar:"تردد المعالج",def:"عدد دورات الساعة في الثانية بالمليارات."},{en:"Core",ar:"النواة",def:"وحدة معالجة مستقلة داخل المعالج."},{en:"Cache",ar:"الذاكرة المخبئية",def:"ذاكرة سريعة صغيرة قرب المعالج."}],reallife:"عندما تلعب لعبة على الهاتف، المعالج CPU يحسب منطق اللعبة (من أصاب من؟ كم بقي من الوقت؟)، بينما معالج الرسوميات GPU يرسم ملايين البكسلات في كل إطار، ستين مرة في الثانية تقريباً. إذا سخن الهاتف فذلك لأن مليارات الترانزستورات تعمل بلا توقف.",analogy:"المعالج **طباخ سريع جداً لكن ذاكرته قصيرة**: يقرأ سطراً واحداً من الوصفة (جلب)، يفهمه (فك ترميز)، ينفذه (تنفيذ)، ثم ينظر إلى إصبعه الذي يشير إلى السطر التالي (عداد البرنامج). المسجلات هي **يداه**: لا تحملان إلا أشياء قليلة لكنها حاضرة فوراً. والأنوية المتعددة تعني **عدة طباخين** في المطبخ نفسه.",mistakes:[{t:"الحكم على سرعة المعالج من GHz فقط",d:"معالج حديث بتردد 3 GHz قد يكون أسرع بكثير من معالج قديم بتردد 4 GHz، بسبب عدد الأنوية والذاكرة المخبئية وكفاءة التصميم."},{t:"الظن أن المعالج يحفظ البرنامج كاملاً داخله",d:"البرنامج في الذاكرة RAM، والمعالج يجلب تعليمة تلو الأخرى. المسجلات تتسع لقيم قليلة فقط."}],summary:["المعالج ينفذ التعليمات بتكرار دورة الجلب وفك الترميز والتنفيذ.","مكوناته: وحدة التحكم، ALU، المسجلات، الذاكرة المخبئية.","GHz = مليارات الدورات في الثانية، والأنوية تسمح بتنفيذ متوازٍ.","GPU يتفوق في العمليات المتوازية الضخمة، ولهذا هو أساس تدريب التعلم العميق."],review:["اشرح دورة الجلب وفك الترميز والتنفيذ بمثال من حياتك.","ما وظيفة عداد البرنامج PC؟","لماذا يُفضل GPU لتدريب الشبكات العصبية؟"],quiz:[{t:"mcq",q:"أي جزء في المعالج ينفذ عملية الجمع 5 + 3؟",o:["وحدة التحكم CU","وحدة الحساب والمنطق ALU","عداد البرنامج PC","الشاشة"],a:1,why:"العمليات الحسابية والمنطقية مهمة ALU. وحدة التحكم توجه فقط."},{t:"mcq",q:"ما ترتيب دورة التعليمة الصحيح؟",o:["تنفيذ ← جلب ← فك ترميز","جلب ← فك ترميز ← تنفيذ","فك ترميز ← جلب ← تنفيذ","جلب ← تنفيذ ← تخزين فقط"],a:1,why:"لا يمكن فهم تعليمة قبل جلبها، ولا تنفيذها قبل فهمها."},{t:"tf",q:"المعالج بتردد 3 GHz يمر بنحو 3 مليارات دورة ساعة في الثانية.",a:!0,why:"Giga = مليار، وHertz = مرة في الثانية."},{t:"fill",q:"المسجل الذي يحفظ عنوان التعليمة التالية يسمى عداد ______.",a:["البرنامج","program counter","pc"],why:"Program Counter."},{t:"mcq",q:"لماذا يُستخدم GPU في تدريب الشبكات العصبية؟",o:["لأنه يرسم الصور فقط","لأنه ينفذ آلاف العمليات المتشابهة بالتوازي","لأنه أرخص دائماً","لأنه يخزن البيانات بشكل دائم"],a:1,why:"تدريب الشبكات العصبية ضرب مصفوفات ضخمة: نفس العملية على بيانات كثيرة، وهذا ما يتقنه GPU."}],exercise:{kind:"open",task:"ابحث عن مواصفات معالج جهازك: في Windows افتح الإعدادات ← النظام ← حول (About)، وفي الهاتف ابحث عن اسم الطراز. سجّل: اسم المعالج، عدد الأنوية، والتردد. ثم اشرح ماذا يعني كل رقم.",solution:'مثال: "Intel Core i5-1235U، 10 أنوية، حتى 4.4 GHz" يعني: 10 أنوية تنفذ تدفقات متوازية من التعليمات، وكل نواة تصل إلى 4.4 مليار دورة ساعة في الثانية في الحالة القصوى. الحرف U يعني أنه معالج موفر للطاقة مخصص للحواسيب المحمولة.'},sources:["cs50x","mitocw"]},{id:"c4",unit:"computer",title:"الذاكرة RAM ووحدات التخزين SSD وHDD",en:"Memory (RAM) and Storage (SSD, HDD)",level:1,minutes:30,prereq:["c3"],goals:["تفهم الفرق الجوهري بين **الذاكرة (Memory)** و**التخزين (Storage)**.","تعرف لماذا تُمسح RAM عند الإطفاء، ولماذا يجب حفظ عملك.","تقارن بين SSD وHDD، وتفهم هرم الذاكرة."],body:`### مشكلة يجب حلها
المعالج سريع جداً، لكنه يحتاج إلى مكان يقرأ منه التعليمات والبيانات. لو قرأها من مكان بطيء لقضى معظم وقته منتظراً. ولو حفظنا كل شيء في مكان سريع جداً لكان مكلفاً جداً ويضيع عند انقطاع الكهرباء. الحل: **أنواع متعددة من الذاكرة**، كل نوع لغرض.

### الذاكرة العشوائية RAM
**ذاكرة الوصول العشوائي (Random Access Memory – RAM)** هي **مكان العمل الحالي**. عندما تفتح برنامجاً يُنسخ من وحدة التخزين إلى RAM، والمعالج يعمل عليه هناك.
- **سريعة جداً** مقارنة بالتخزين.
- **متطايرة (Volatile)**: تفقد كل محتواها عند انقطاع الكهرباء.
- **عشوائية الوصول**: الوصول إلى أي خانة يستغرق الوقت نفسه تقريباً، لأن لكل خانة **عنواناً (Address)** رقمياً.
- سعتها في الأجهزة الحالية غالباً 8 إلى 32 جيجابايت.

### وحدات التخزين
**التخزين (Storage)** هو **الأرشيف الدائم**: يحفظ الملفات ونظام التشغيل والبرامج حتى بعد الإطفاء، أي أنه **غير متطاير (Non-volatile)**.

| | HDD القرص الصلب | SSD قرص الحالة الصلبة |
|---|---|---|
| كيف يعمل؟ | أقراص مغناطيسية تدور ورأس قراءة يتحرك | شرائح ذاكرة فلاش إلكترونية بلا أجزاء متحركة |
| السرعة | أبطأ | أسرع بكثير |
| التحمل | يتأثر بالصدمات | أكثر تحملاً |
| السعر لكل جيجابايت | أرخص | أغلى |
| الاستخدام الحالي | أرشفة البيانات الضخمة | أغلب الحواسيب والهواتف الحديثة |

### جرّب بنفسك: أين تعيش بياناتك؟
افتح الملف، عدّله، ثم أطفئ الجهاز **قبل** الحفظ. ثم أعد التجربة مع الحفظ:

[[sim:memory]]

### هرم الذاكرة (Memory Hierarchy)
كلما اقتربت الذاكرة من المعالج كانت أسرع وأصغر وأغلى:

**المسجلات ← الذاكرة المخبئية Cache ← RAM ← SSD ← HDD**

(من الأسرع والأصغر، إلى الأبطأ والأكبر)

### الصلة بالبرمجة والذكاء الاصطناعي
- كل **متغير** ستنشئه في Python يعيش في RAM أثناء تشغيل البرنامج. إذا أردت الاحتفاظ بالبيانات بعد انتهاء البرنامج يجب كتابتها في **ملف** أو **قاعدة بيانات** على وحدة التخزين (الوحدة السادسة).
- تدريب النماذج الكبيرة محدود غالباً بحجم الذاكرة: يجب أن تتسع ذاكرة GPU لأوزان النموذج والبيانات أثناء الحساب.`,terms:[{en:"RAM",ar:"ذاكرة الوصول العشوائي",def:"ذاكرة العمل السريعة المؤقتة."},{en:"Storage",ar:"وحدة التخزين",def:"حفظ دائم للملفات والبرامج."},{en:"Volatile",ar:"متطايرة",def:"تفقد محتواها عند انقطاع الكهرباء."},{en:"Non-volatile",ar:"غير متطايرة",def:"تحتفظ بالمحتوى دون كهرباء."},{en:"SSD",ar:"قرص الحالة الصلبة",def:"تخزين إلكتروني سريع بلا أجزاء متحركة."},{en:"HDD",ar:"القرص الصلب",def:"تخزين مغناطيسي بأقراص دوارة."},{en:"Memory Address",ar:"عنوان الذاكرة",def:"رقم يحدد موقع خانة في الذاكرة."},{en:"Memory Hierarchy",ar:"هرم الذاكرة",def:"ترتيب أنواع الذاكرة حسب السرعة والحجم."}],reallife:'هاتفك فيه "8 GB RAM و256 GB تخزين". الـ 256 GB هي مساحة صورك وتطبيقاتك (دائمة). الـ 8 GB هي ما يحدد كم تطبيقاً يبقى مفتوحاً في الخلفية: عندما تمتلئ، يغلق النظام التطبيقات القديمة، فتلاحظ أن التطبيق "يبدأ من جديد" عند العودة إليه.',analogy:"**RAM هي سطح مكتبك، والتخزين هو خزانة الملفات.** عندما تدرس تُخرج الكتب من الخزانة وتضعها على المكتب لأن الوصول إليها هناك فوري. المكتب أصغر من الخزانة. وفي آخر اليوم، عامل التنظيف يمسح المكتب بالكامل (إطفاء الجهاز)، فما لم تُعده إلى الخزانة (الحفظ) يضيع.",mistakes:[{t:'قول "ذاكرة هاتفي 256 جيجا" وقصد التخزين',d:"في الاستخدام اليومي يُخلط بينهما، لكن في الجامعة يجب التمييز: الذاكرة (Memory/RAM) مؤقتة، والتخزين (Storage) دائم."},{t:"الظن أن زيادة RAM تزيد مساحة الملفات",d:"RAM لا تحفظ ملفاتك. زيادتها تجعل الجهاز يتعامل مع برامج أكثر أو أكبر في الوقت نفسه."}],summary:["RAM سريعة ومتطايرة: مكان العمل الحالي للمعالج.","التخزين (SSD/HDD) أبطأ لكنه دائم: مكان حفظ الملفات.","فتح الملف = نسخ من التخزين إلى RAM، والحفظ = نسخ من RAM إلى التخزين.","SSD أسرع وأكثر تحملاً، وHDD أرخص للسعات الكبيرة.","هرم الذاكرة: المسجلات، Cache، RAM، SSD، HDD."],review:["لماذا يضيع عملك غير المحفوظ عند انقطاع الكهرباء؟","رتّب من الأسرع إلى الأبطأ: HDD، المسجلات، RAM، SSD، Cache.","أين يعيش متغير Python أثناء تشغيل البرنامج؟"],quiz:[{t:"mcq",q:"أي نوع من الذاكرة يفقد محتواه عند الإطفاء؟",o:["SSD","HDD","RAM","الفلاش USB"],a:2,why:"RAM ذاكرة متطايرة (Volatile)."},{t:"tf",q:"عندما تعدّل مستنداً مفتوحاً، يتغير الملف على SSD فوراً قبل أن تضغط حفظ.",a:!1,why:"التعديل يحدث في RAM. الحفظ هو الذي ينسخ التغييرات إلى وحدة التخزين. (بعض البرامج تحفظ تلقائياً كل فترة، لكن هذا حفظ أيضاً.)"},{t:"mcq",q:"ما الذي يجعل SSD أسرع من HDD؟",o:["يدور أسرع","لا يحتوي أجزاء متحركة ويعتمد على شرائح إلكترونية","سعته أصغر دائماً","متطاير مثل RAM"],a:1,why:"HDD ينتظر دوران القرص وحركة الرأس، أما SSD فإلكتروني بالكامل.",f:["SSD لا يدور أصلاً؛ الذي يدور هو HDD.",void 0,"السعة لا علاقة لها بالسرعة.","SSD غير متطاير؛ يحتفظ بالبيانات دون كهرباء."]},{t:"mcq",q:"أي ترتيب صحيح من الأسرع إلى الأبطأ؟",o:["RAM، Cache، المسجلات","المسجلات، Cache، RAM، SSD","SSD، RAM، Cache","HDD، SSD، RAM"],a:1,why:"كلما اقتربت الذاكرة من المعالج كانت أسرع."},{t:"fill",q:"لكل خانة في RAM رقم يحدد موقعها يسمى ______.",a:["العنوان","عنوان","address","عنوان الذاكرة"],why:"Memory Address."}],exercise:{kind:"answer",task:"لديك جهاز فيه RAM بسعة 16 GB، وتريد تدريب نموذج يحتاج تحميل بيانات حجمها 10 GB إلى الذاكرة، مع أن نظام التشغيل والبرامج المفتوحة تستهلك 7 GB. كم جيجابايت **ينقصك**؟ (اكتب الرقم فقط)",accept:["1","1gb","١"],hint:"المتاح = السعة الكلية − ما هو مستخدم. قارن المتاح بالمطلوب.",solution:"المتاح = 16 − 7 = 9 GB، والمطلوب 10 GB، إذن ينقصك **1 GB**. الحلول الواقعية: إغلاق برامج، أو تحميل البيانات على دفعات (Batches) بدل تحميلها كلها، وهي تقنية أساسية في تعلم الآلة."},sources:["cs50x"]},{id:"c5",unit:"computer",title:"البيانات والمعلومات",en:"Data and Information",level:1,minutes:20,prereq:["c4"],goals:["تفرّق بين **البيانات (Data)** و**المعلومات (Information)**.","تتعرف على أنواع البيانات: منظمة وغير منظمة، رقمية ونصية.",'تفهم لماذا يقال إن البيانات "وقود" الذكاء الاصطناعي.'],body:`### البيانات: المادة الخام
**البيانات (Data)** حقائق أو قيم خام بلا سياق: \`85\`، \`"Ali"\`، \`2026-11-24\`، صورة، تسجيل صوتي. وحدها لا تخبرك بشيء مفيد. ماذا يعني الرقم 85؟ درجة؟ وزن؟ سرعة؟

### المعلومات: بيانات ذات معنى
**المعلومات (Information)** بيانات **عولجت ونُظمت ووُضعت في سياق** فصارت مفيدة لاتخاذ قرار.

مثال: البيانات \`[85, 70, 92, 45, 66]\` هي درجات خمسة طلاب.
- بعد المعالجة: "متوسط الدرجات 71.6، وطالب واحد راسب" ← هذه **معلومة**.
- القرار: "يحتاج الطالب الراسب إلى حصة دعم" ← هذا ما تسمح به المعلومة.

وهنا تظهر وظيفة الحاسوب من الدرس الأول: **بيانات تدخل، معالجة، معلومات تخرج**.

### أنواع البيانات
**حسب الشكل:**
- **رقمية (Numerical)**: أعمار، درجات، أسعار.
- **نصية (Text)**: أسماء، رسائل، مقالات.
- **صور وفيديو وصوت**: في النهاية كلها أرقام كما سنرى في الدرسين القادمين.
- **منطقية (Boolean)**: صح أو خطأ فقط، مثل: هل الطالب ناجح؟

**حسب التنظيم:**
- **بيانات منظمة (Structured Data)**: في جداول بصفوف وأعمدة، مثل جدول درجات في Excel أو قاعدة بيانات.
- **بيانات غير منظمة (Unstructured Data)**: نصوص حرة، صور، تسجيلات صوتية. أغلب بيانات العالم من هذا النوع، ومعالجتها من أهم مجالات الذكاء الاصطناعي.

### لماذا البيانات مهمة جداً في تخصصك؟
في البرمجة التقليدية، **المبرمج يكتب القواعد**: "إذا كانت الدرجة ≥ 50 فالطالب ناجح".

في **تعلم الآلة (Machine Learning)**، نعطي الحاسوب **أمثلة كثيرة** (بيانات) ونتركه **يستنتج القاعدة بنفسه**. مثلاً: آلاف صور القطط والكلاب مع الإجابة الصحيحة لكل صورة، فيتعلم النموذج التمييز بينها. لذلك:
- جودة النموذج تعتمد على جودة البيانات. عبارة مشهورة في المجال: **Garbage In, Garbage Out** أي "إذا أدخلت قمامة ستخرج قمامة".
- البيانات المتحيزة تنتج نموذجاً متحيزاً.

داخل المعالج مليارات الترانزستورات، وكل ترانزستور مفتاح كهربائي له حالتان فقط: **يمر تيار** أو **لا يمر تيار**. نرمز للحالتين بالرقمين **1** و**0**.

كل شيء في الحاسوب، الأوامر والأرقام والنصوص والصور والأصوات، يُمثل في النهاية بتسلسلات من 0 و1. هذا ما يسمى **النظام الثنائي (Binary System)**.

### لماذا حالتان فقط؟
لأن التمييز بين حالتين **موثوق جداً**. لو استخدمنا عشر درجات من الجهد الكهربائي لتمثيل الأرقام من 0 إلى 9، لأدى أي تشويش بسيط إلى خلط 6 بـ 7. أما "يوجد تيار أو لا يوجد" فيصعب الخلط بينهما.

### لغة الآلة
**لغة الآلة (Machine Language)** هي التعليمات بصيغتها الثنائية التي ينفذها المعالج مباشرة، مثل \`10110000 01100001\`. لا أحد تقريباً يكتب بها اليوم. نكتب بلغات مفهومة للبشر مثل Python، ثم تُترجم إلى لغة الآلة (سنفهم كيف في الوحدة الثانية).

### النظام العشري: ما تعرفه أصلاً
في **النظام العشري (Decimal)** نستخدم عشرة رموز (0–9)، وقيمة كل خانة عشرة أضعاف التي على يمينها:

\`\`\`text
345 = 3×100 + 4×10 + 5×1
\`\`\`

### النظام الثنائي: نفس الفكرة بالرقم 2
في النظام الثنائي رمزان فقط (0 و1)، وقيمة كل خانة **ضعف** التي على يمينها: 1، 2، 4، 8، 16، 32، 64، 128…

\`\`\`text
1101 (ثنائي) = 1×8 + 1×4 + 0×2 + 1×1 = 13 (عشري)
\`\`\`

### التحويل من عشري إلى ثنائي
**طريقة القسمة المتكررة على 2**: اقسم واحفظ الباقي، ثم اقرأ البواقي من الأسفل إلى الأعلى.

\`\`\`text
13 ÷ 2 = 6  الباقي 1
 6 ÷ 2 = 3  الباقي 0
 3 ÷ 2 = 1  الباقي 1
 1 ÷ 2 = 0  الباقي 1
اقرأ من الأسفل: 1101
\`\`\`

**طريقة الأوزان (الأسرع ذهنياً)**: ما أكبر قوة للعدد 2 تدخل في 13؟ 8. يبقى 5. ثم 4، يبقى 1. ثم 1. إذن 8 + 4 + 1، فنضع 1 في خانات 8 و4 و1، و0 في خانة 2: **1101**.

لبت: أصغر وحدة
**البت (Bit)** اختصار لـ **Binary Digit** أي "رقم ثنائي": خانة واحدة قيمتها 0 أو 1. هو أصغر وحدة معلومات في الحاسوب.

### البايت: 8 بتات
**البايت (Byte)** = **8 بتات**. هو الوحدة الأساسية لقياس حجم البيانات. لماذا 8؟ لأسباب تاريخية وعملية: 8 بتات تكفي لتمثيل 256 قيمة، وهذا يكفي لكل الحروف الإنجليزية والأرقام والرموز في الترميز التقليدي.

> انتبه للرمز: **b** صغيرة = bit، و**B** كبيرة = Byte. سرعة الإنترنت 100 Mbps تعني 100 **ميجابت** في الثانية، أي نحو 12.5 **ميجابايت** في الثانية فقط.

### كم قيمة تمثلها n بت؟
كل بت يضاعف عدد الاحتمالات:

| عدد البتات | عدد القيم الممكنة | المدى (أعداد موجبة) |
|---|---|---|
| 1 | 2¹ = 2 | 0 – 1 |
| 4 | 2⁴ = 16 | 0 – 15 |
| 8 (بايت) | 2⁸ = 256 | 0 – 255 |
| 16 | 2¹⁶ = 65,536 | 0 – 65,535 |
| 32 | 2³² ≈ 4.3 مليار | |
| 64 | 2⁶⁴ ≈ 1.8 × 10¹⁹ | |

**القاعدة**: عدد القيم = **2 مرفوعة لعدد البتات**.

### وحدات الحجم
| الوحدة | الرمز | تقريباً |
|---|---|---|
| Kilobyte | KB | ألف بايت (رسالة نصية قصيرة) |
| Megabyte | MB | مليون بايت (صورة هاتف أو أغنية) |
| Gigabyte | GB | مليار بايت (فيلم، أو RAM هاتفك) |
| Terabyte | TB | ألف مليار بايت (قرص صلب كبير) |

### 1000 أم 1024؟
هنا تفصيل يسأل عنه الأساتذة:
- في **النظام الدولي للوحدات (SI)**: 1 KB = **1000** بايت، كما في 1 كيلوغرام = 1000 غرام. الشركات المصنعة للأقراص تستخدم هذا.
- لأن الحاسوب ثنائي، اعتاد المبرمجون تاريخياً على 1 KB = **1024** بايت (2¹⁰). للتمييز أُنشئت وحدات خاصة: **KiB, MiB, GiB** (كيبيبايت، ميبيبايت…) حيث 1 KiB = 1024 بايت.
- Windows يعرض الأحجام بقاعدة 1024 لكنه يكتب "GB". لهذا القرص المكتوب عليه 1 TB يظهر في Windows بحجم 931 GB تقريباً. لم يُسرق منك شيء!

### الصلة بالذكاء الاصطناعي
حجم النموذج يُحسب هكذا: عدد الأوزان × حجم كل وزن. نموذج فيه 7 مليارات وزن، كل وزن 16 بت (2 بايت)، يحتاج نحو **14 GB** لتخزين أوزانه فقط. لهذا تسمع عن تقنيات "تكميم" (Quantization) تقلل البتات لكل وزن لتصغير النماذج.`,terms:[{en:"Bit",ar:"البت",def:"خانة ثنائية واحدة: 0 أو 1."},{en:"Byte",ar:"البايت",def:"8 بتات، الوحدة الأساسية للحجم."},{en:"Kilobyte / Megabyte / Gigabyte",ar:"كيلو / ميجا / جيجا بايت",def:"ألف / مليون / مليار بايت تقريباً."},{en:"KiB / MiB / GiB",ar:"كيبي / ميبي / جيبي بايت",def:"وحدات بقاعدة 1024 بدقة."},{en:"Bandwidth (Mbps)",ar:"عرض النطاق / سرعة النقل",def:"ميجابت في الثانية."}],reallife:"باقة إنترنت سرعتها 40 Mbps. كم تحتاج لتحميل لعبة حجمها 2 GB؟ 40 ميجابت = 5 ميجابايت في الثانية. 2 GB = 2000 MB تقريباً. 2000 ÷ 5 = **400 ثانية** أي نحو 7 دقائق، في أحسن الظروف.",analogy:'البت **حرف واحد** في كلمة، والبايت **كلمة من 8 حروف**، والكيلوبايت **صفحة**، والميجابايت **كتاب**، والجيجابايت **مكتبة صغيرة**. وكل بت إضافي "يضاعف" عدد الكلمات الممكنة، مثل إضافة سؤال نعم/لا جديد إلى لعبة تخمين.',mistakes:[{t:"الخلط بين Mb وMB",d:"b صغيرة = بت، B كبيرة = بايت. الفرق 8 أضعاف."},{t:"الظن أن 4 بتات تعطي 8 قيم",d:"القيم = 2⁴ = 16 وليس 4 × 2. كل بت يضاعف ولا يجمع."}],summary:["البت أصغر وحدة (0 أو 1)، والبايت 8 بتات.","عدد القيم لـ n بت = 2ⁿ.","KB، MB، GB، TB تقريباً ألف، مليون، مليار، ألف مليار بايت.","KiB = 1024 بايت بدقة، وهذا سبب اختلاف الأحجام المعروضة."],review:["كم بايت في 64 بت؟","لماذا يظهر قرص 500 GB في Windows بحجم أقل؟","كم قيمة تمثلها 10 بتات؟"],quiz:[{t:"fill",q:"البايت الواحد يساوي ______ بتات.",a:["8","ثمانية","٨","ثمان"],why:"1 Byte = 8 bits."},{t:"mcq",q:"كم قيمة مختلفة يمكن تمثيلها بـ 4 بتات؟",o:["4","8","16","32"],a:2,why:"2⁴ = 16.",f:["4 هو عدد البتات وليس عدد القيم.","8 = 4 × 2. لكن كل بت يضاعف العدد: 2 × 2 × 2 × 2.",void 0,"32 = 2⁵ أي 5 بتات."]},{t:"mcq",q:"سرعة 80 Mbps تساوي تقريباً:",o:["80 ميجابايت/ث","10 ميجابايت/ث","640 ميجابايت/ث","8 ميجابايت/ث"],a:1,why:"80 ÷ 8 = 10 MB/s."},{t:"tf",q:"1 KiB = 1024 بايت.",a:!0,why:"KiB تعني 2¹⁰ = 1024 بدقة."},{t:"tf",q:"الحرف b الصغيرة في Mbps تعني Byte.",a:!1,why:"b صغيرة = bit."}],exercise:{kind:"answer",task:"صورة أبعادها 100 × 100 بكسل، وكل بكسل يحتاج 3 بايت (أحمر وأخضر وأزرق). كم **بايت** تحتاج الصورة بدون ضغط؟",accept:["30000","30,000","30000 بايت","٣٠٠٠٠"],hint:"عدد البكسلات × عدد البايتات لكل بكسل.",solution:"100 × 100 = 10,000 بكسل. × 3 بايت = **30,000 بايت** ≈ 30 KB. صيغ مثل JPEG وPNG تضغط الصور لتصغير هذا الحجم."},sources:["cs50x"]},{id:"c8",unit:"computer",title:"تمثيل الأرقام والنصوص والصور داخل الحاسوب",en:"Representing Numbers, Text and Images",level:2,minutes:35,prereq:["c7"],goals:["تفهم كيف تتحول الحروف إلى أرقام عبر **ASCII** و**Unicode**.","تعرف لماذا يأخذ الحرف العربي بايتين في **UTF-8**.","تفهم تمثيل الصور بالبكسلات وRGB، والصوت بأخذ العينات."],body:`### الفكرة الكبرى: كل شيء رقم
تعلمنا أن الحاسوب يخزن 0 و1 فقط. إذن كيف يخزن كلمة "سلام" أو صورة وجهك؟ الجواب: نتفق على **ترميز (Encoding)**، أي جدول يربط كل شيء برقم، ثم نخزن الرقم بالثنائي.

### الأرقام
- **الأعداد الصحيحة (Integers)**: تُخزن بالثنائي كما تعلمنا. للأعداد السالبة تستخدم الحواسيب طريقة اسمها **المتمم الثنائي (Two's Complement)**، وستدرسها في مادة تنظيم الحاسوب.
- **الأعداد العشرية (Floating-point)**: مثل 3.14، تُخزن بصيغة علمية ثنائية (معيار IEEE 754). نتيجة مهمة لك كمبرمج: بعض الكسور **لا تُمثل بدقة تامة**. في Python جرّب لاحقاً \`0.1 + 0.2\` وستحصل على \`0.30000000000000004\`!

### النصوص: ASCII
في الستينيات اتُفق على جدول **ASCII** (American Standard Code for Information Interchange) يربط 128 رمزاً بأرقام من 0 إلى 127:
- \`A\` = 65، \`B\` = 66، … \`Z\` = 90
- \`a\` = 97 (الحروف الصغيرة لها أرقام مختلفة عن الكبيرة!)
- \`0\` = 48 (الحرف "0" يختلف عن الرقم 0)
- المسافة = 32

المشكلة: ASCII لا يحتوي حروفاً عربية ولا صينية ولا رموزاً تعبيرية.

### النصوص: Unicode وUTF-8
**Unicode** معيار عالمي يعطي رقماً فريداً لكل حرف في كل لغات العالم تقريباً، اسمه **نقطة الترميز (Code Point)**. مثلاً: \`س\` = 1587، و\`A\` = 65 (حافظ Unicode على أرقام ASCII).

**UTF-8** طريقة لتخزين أرقام Unicode بالبايتات بحجم متغير:
- حروف ASCII: **بايت واحد**.
- الحروف العربية: **بايتان**.
- كثير من الرموز التعبيرية: **أربعة بايتات**.

UTF-8 هو الترميز المهيمن على الويب اليوم، وهو الافتراضي في Python 3.

### الصور: شبكة من البكسلات
الصورة الرقمية شبكة من نقاط صغيرة اسمها **بكسل (Pixel)**:
- صورة أبيض وأسود: كل بكسل بت واحد (0 أبيض، 1 أسود).
- صورة رمادية: كل بكسل بايت (0 أسود، 255 أبيض، وما بينهما درجات رمادي).
- صورة ملونة: كل بكسل **3 أرقام** للأحمر والأخضر والأزرق (**RGB**)، كل رقم من 0 إلى 255. مثلاً (255, 0, 0) أحمر صافٍ، و(255, 255, 255) أبيض.

صورة Full HD (1920 × 1080) ملونة بدون ضغط = 1920 × 1080 × 3 ≈ **6.2 مليون بايت**.

اكتب نصاً عربياً وإنجليزياً، ولاحظ عدد البايتات. ثم ارسم شكلاً في شبكة البكسلات:

مج؟",en:"What is Programming and How Programmers Think",level:1,minutes:30,prereq:["c8"],goals:["تعرف معنى **البرمجة (Programming)** و**البرنامج (Program)**.","تفهم لماذا يحتاج الحاسوب تعليمات دقيقة لا تحتمل التأويل.","تتعلم خطوات **التفكير الحاسوبي (Computational Thinking)** التي يستخدمها المبرمجون."],body:`### البرمجة في جملة
**البرمجة (Programming)** هي كتابة تعليمات دقيقة ومرتبة يفهمها الحاسوب وينفذها لحل مشكلة أو إنجاز مهمة. ناتج البرمجة هو **البرنامج (Program)**.

### لماذا نحتاج البرمجة؟
تعلمنا أن الحاسوب سريع جداً لكنه لا يفعل شيئاً من تلقاء نفسه. البرمجة هي الطريقة الوحيدة لنقل **فكرة الحل** من عقلك إلى الآلة. وبمجرد كتابة البرنامج يمكن تنفيذه مليون مرة دون تعب أو خطأ:
- **الأتمتة (Automation)**: حساب معدلات 5000 طالب في ثانية بدل أيام.
- **المعالجة الضخمة**: تحليل ملايين الصور الطبية.
- **بناء الأدوات**: التطبيقات والمواقع والألعاب.
- **الذكاء الاصطناعي**: كل نموذج ذكاء اصطناعي هو برنامج، وتدريبه برنامج، واستخدامه برنامج.

### الحاسوب حرفي جداً
تجربة مشهورة في المقررات التمهيدية مثل CS50: اطلب من صديق أن "يصنع شطيرة" وهو ينفذ تعليماتك **حرفياً**. إذا قلت "ضع الزبدة على الخبز" قد يضع علبة الزبدة كاملة فوق كيس الخبز المغلق! لأنك لم تقل: افتح الكيس، أخرج شريحة، افتح العلبة، خذ سكيناً…

هذا بالضبط الحاسوب: **ينفذ ما تكتبه، لا ما تقصده**. ولذلك أهم مهارة للمبرمج ليست حفظ الأوامر، بل **التفكير الواضح الدقيق**.

### كيف يفكر المبرمج؟ التفكير الحاسوبي
يستخدم المبرمجون أربع مهارات ذهنية، تسمى معاً **التفكير الحاسوبي (Computational Thinking)**:

1. **التحليل (Decomposition)**: تقسيم المشكلة الكبيرة إلى مشكلات صغيرة. "بناء تطبيق للجامعة" ← تسجيل الدخول، عرض الجدول، عرض الدرجات…
2. **التعرف على الأنماط (Pattern Recognition)**: ملاحظة ما يتكرر. حساب معدل الطالب الأول مثل الثاني مثل الألف، إذن نكتب الحل مرة واحدة ونكرره.
3. **التجريد (Abstraction)**: تجاهل التفاصيل غير المهمة. لحساب المعدل يهمك رقم الدرجة، لا لون قميص الطالب.
4. **تصميم الخوارزمية (Algorithm Design)**: كتابة خطوات الحل بترتيب دقيق. (الوحدة الرابعة كاملة عن هذا.)

### مثال كامل: هل الطالب ناجح؟
**المشكلة**: لدينا درجة طالب، ونريد معرفة نجاحه.
- **المدخلات (Input)**: الدرجة.
- **المعالجة (Process)**: مقارنة الدرجة بـ 50.
- **المخرجات (Output)**: "ناجح" أو "راسب".
- **الخطوات**:
  1. اقرأ الدرجة.
  2. إذا كانت الدرجة 50 أو أكثر، اطبع "ناجح".
  3. وإلا، اطبع "راسب".

لاحظ أنك صممت برنامجاً كاملاً بدون كتابة كود! **الكود مجرد ترجمة لهذه الخطوات إلى لغة برمجة.** ستكتب هذا البرنامج نفسه بـ Python في الوحدة الثالثة، وستراه كمخطط انسيابي في الوحدة الرابعة.

### عادات المبرمج الجيد
- يفهم المشكلة **قبل** أن يكتب سطراً.
- يجرب حلوله على أمثلة صغيرة بيده.
- يتوقع الحالات الغريبة: ماذا لو كانت الدرجة سالبة؟ ماذا لو أدخل المستخدم حروفاً؟
- لا يخاف من الأخطاء؛ يقرؤها ويتعلم منها.`,terms:[{en:"Programming",ar:"البرمجة",def:"كتابة تعليمات دقيقة لينفذها الحاسوب."},{en:"Programmer",ar:"المبرمج",def:"من يصمم الحلول ويكتبها كبرامج."},{en:"Computational Thinking",ar:"التفكير الحاسوبي",def:"أسلوب حل المشكلات بطريقة يمكن للحاسوب تنفيذها."},{en:"Decomposition",ar:"التحليل / التجزئة",def:"تقسيم المشكلة إلى أجزاء أصغر."},{en:"Pattern Recognition",ar:"التعرف على الأنماط",def:"ملاحظة التشابه والتكرار."},{en:"Abstraction",ar:"التجريد",def:"التركيز على المهم وإهمال التفاصيل غير الضرورية."},{en:"Automation",ar:"الأتمتة",def:"جعل الحاسوب ينجز المهام المتكررة تلقائياً."}],reallife:"موظف التسجيل في جامعتك يحسب معدلات الطلاب يدوياً في Excel كل فصل. لو كتب برنامجاً بسيطاً مرة واحدة، لأنجز العمل في ثوانٍ كل فصل لسنوات. هذه قيمة البرمجة: **تكتب مرة، وتستفيد إلى الأبد**.",analogy:'البرمجة مثل **كتابة وصفة لشخص لم يدخل مطبخاً في حياته، ويطيعك حرفياً، ولا يسأل أي سؤال**. إذا نسيت "أطفئ النار" سيبقى يطبخ إلى الأبد. لذلك تكتب الوصفة بدقة كاملة، وتراجعها، وتجربها.',mistakes:[{t:"البدء بكتابة الكود قبل فهم المشكلة",d:"أغلب المبتدئين يفتحون المحرر فوراً. المحترفون يقضون وقتاً في الورقة والقلم أولاً: ما المدخلات؟ ما المخرجات المطلوبة؟ ما الخطوات؟"},{t:"الظن أن البرمجة = حفظ الأوامر",d:"الأوامر تُحفظ مع الممارسة وتجدها في التوثيق. المهارة الحقيقية هي التفكير وحل المشكلات."}],summary:["البرمجة كتابة تعليمات دقيقة لحل مشكلة.","الحاسوب ينفذ ما تكتبه حرفياً، لا ما تقصده.","التفكير الحاسوبي: تحليل، أنماط، تجريد، خوارزمية.","حدد دائماً المدخلات والمعالجة والمخرجات قبل الكود."],review:['طبّق التحليل على مشكلة "تنظيم رحلة جامعية".',"ما الفرق بين ما تكتبه وما تقصده بالنسبة للحاسوب؟","حدد المدخلات والمخرجات لبرنامج يحول درجات الحرارة من مئوي إلى فهرنهايت."],quiz:[{t:"mcq",q:'تقسيم مشكلة "بناء تطبيق" إلى أجزاء أصغر يسمى:',o:["التجريد","التحليل Decomposition","الأتمتة","التصحيح"],a:1,why:"Decomposition = تجزئة المشكلة."},{t:"mcq",q:"عند حساب معدل طالب تجاهلت اسم مدرسته الثانوية. هذا مثال على:",o:["التجريد Abstraction","التعرف على الأنماط","التحليل","لغة الآلة"],a:0,why:"التجريد: إهمال التفاصيل غير المؤثرة في الحل."},{t:"tf",q:"الحاسوب يفهم قصدك حتى لو كانت تعليماتك ناقصة.",a:!1,why:"ينفذ التعليمات حرفياً فقط."},{t:"mcq",q:'في برنامج "هل الطالب ناجح؟" ما المدخلات؟',o:["كلمة ناجح","الدرجة","الرقم 50","الشاشة"],a:1,why:"الدرجة تأتي من المستخدم. الرقم 50 جزء ثابت من منطق البرنامج."},{t:"fill",q:"جعل الحاسوب ينجز المهام المتكررة تلقائياً يسمى ______.",a:["الأتمتة","الاتمتة","automation"],why:"Automation."}],exercise:{kind:"open",task:"اكتب خطوات دقيقة (كأنك تكتب لروبوت حرفي) لعمل كوب شاي. بعدها اقرأها كأنك الروبوت: هل هناك خطوة يمكن فهمها بشكل خاطئ؟ عدّلها.",solution:`**مثال جيد:**
1. خذ الإبريق.
2. إذا كان الإبريق فارغاً: املأه بالماء حتى المنتصف.
3. ضع الإبريق على الموقد وأشعل النار.
4. كرر: انتظر 30 ثانية، **حتى** يغلي الماء.
5. أطفئ النار.
6. ضع كيس شاي في الكوب.
7. اسكب الماء في الكوب حتى يمتلئ ثلاثة أرباعه.
8. انتظر 3 دقائق ثم أخرج الكيس.

لاحظ أنك استخدمت **شرطاً** (إذا كان فارغاً) و**تكراراً** (كرر حتى يغلي) و**تسلسلاً**. هذه بالضبط المكونات الثلاثة لكل خوارزمية!`},sources:["cs50x","cs50p"]},{id:"p2",unit:"programming",title:"البرنامج ولغات البرمجة: لماذا توجد لغات كثيرة؟",en:"Programs and Programming Languages",level:1,minutes:30,prereq:["p1"],goals:["تعرف ما هي **لغة البرمجة** والفرق بين اللغات منخفضة وعالية المستوى.","تقارن بين **Python وC وC++ وJava وJavaScript**.","تفهم لماذا نتعلم Python أولاً في تخصص الذكاء الاصطناعي."],body:`### ما هو البرنامج فعلياً؟
**البرنامج (Program)** ملف (أو مجموعة ملفات) يحتوي تعليمات مكتوبة بلغة برمجة. عندما "تشغّل" برنامجاً، يُحمّل إلى RAM ويبدأ المعالج تنفيذ تعليماته. البرنامج أثناء تشغيله يسمى **عملية (Process)**، وهذا ما رأيته في مدير المهام.

### ما هي لغة البرمجة؟
**لغة البرمجة (Programming Language)** لغة صناعية لها مفردات وقواعد صارمة، تسمح للبشر بكتابة تعليمات يمكن ترجمتها إلى لغة الآلة. هي "وسيط" بين تفكير الإنسان وثنائية الآلة.

### مستويات اللغات
- **لغة الآلة (Machine Language)**: 0 و1. يفهمها المعالج مباشرة، ويستحيل عملياً على البشر الكتابة بها.
- **لغة التجميع (Assembly)**: كلمات مختصرة بدل الأرقام، مثل \`ADD\` و\`MOV\`. ما زالت قريبة جداً من العتاد.
- **اللغات عالية المستوى (High-level Languages)**: قريبة من لغة البشر، مثل \`print("مرحبا")\`. سطر واحد منها قد يتحول إلى عشرات تعليمات الآلة.

كلما ارتفع المستوى: **أسهل في الكتابة والقراءة**، لكن **تحكم أقل في تفاصيل العتاد**، وأحياناً **أبطأ في التنفيذ**.

### لماذا لا توجد لغة واحدة لكل شيء؟
لأن المهام مختلفة، وكل لغة صُممت بأولويات مختلفة: السرعة، أو السهولة، أو الأمان، أو العمل في المتصفح. مثل الأدوات في ورشة: المطرقة لا تغني عن المفك.

t لغة المتصفحات."},{t:"mcq",q:"لماذا تعد Python سريعة كفاية للذكاء الاصطناعي؟",o:["لأنها أسرع من C","لأن مكتباتها الثقيلة مكتوبة داخلياً بـ C/C++","لأنها لا تحتاج معالجاً","لأنها لغة آلة"],a:1,why:"Python تستدعي كوداً سريعاً مكتوباً بلغات منخفضة المستوى."},{t:"tf",q:"Java وJavaScript لغة واحدة بإصدارين.",a:!1,why:"لغتان مختلفتان تماماً."},{t:"mcq",q:"أي ترتيب صحيح من الأقرب إلى العتاد إلى الأبعد؟",o:["Python، Assembly، لغة الآلة","لغة الآلة، Assembly، Python","Assembly، لغة الآلة، Python","Python، لغة الآلة، Assembly"],a:1,why:"لغة الآلة هي العتاد مباشرة، ثم Assembly، ثم اللغات العالية."},{t:"fill",q:"البرنامج أثناء تشغيله يسمى ______ (Process).",a:["عملية","العملية"],why:"Process = عملية."}],exercise:{kind:"open",task:"لكل حالة اختر اللغة الأنسب وبرر في سطر: (1) تحليل جدول درجات 10,000 طالب. (2) زر تفاعلي في موقع الجامعة. (3) برنامج تحكم لجهاز طبي صغير بذاكرة محدودة جداً. (4) تدريب نموذج يصنف صور الأشعة.",solution:`1. **Python** (مع Pandas): تحليل البيانات سهل ومكتباته جاهزة.

**الكود المصدري (Source Code)** هو النص الذي يكتبه المبرمج بلغة البرمجة، ويُحفظ في ملف نصي عادي. ملفات Python تنتهي بـ \`.py\`، مثل \`grades.py\`. يمكنك فتحه بأي محرر نصوص وقراءته.

لكن المعالج لا يفهم هذا النص؛ يفهم لغة الآلة فقط. إذن نحتاج **مترجماً** بين الطرفين. وهنا طريقتان رئيسيتان.

### الطريقة الأولى: المترجم (Compiler)
**المترجم** برنامج يقرأ الكود المصدري **كاملاً**، ويحوّله كله دفعة واحدة إلى ملف بلغة الآلة (ملف تنفيذي، مثل \`.exe\` في Windows)، ثم تشغّل هذا الملف متى شئت.
- إذا وجد المترجم أي خطأ في القواعد، **يرفض** إنتاج الملف التنفيذي، ولا يُنفذ أي سطر.
- التشغيل بعد الترجمة **سريع جداً**، ولا يحتاج المستخدم إلى المترجم.
- لكن الملف التنفيذي مرتبط بنوع المعالج ونظام التشغيل.
- أمثلة: **C، C++، Rust، Go**.

### الطريقة الثانية: المفسر (Interpreter)
**المفسر** يقرأ الكود ويُنفذه **مباشرة** أثناء القراءة، دون إنتاج ملف تنفيذي مستقل.
- يمكنك التجربة فوراً: تكتب سطراً وترى نتيجته.
- الأخطاء أثناء التشغيل تظهر عند الوصول إلى السطر الذي فيه المشكلة.
- عادة **أبطأ** من الكود المترجم، ويحتاج المستخدم إلى وجود المفسر.
- أمثلة: **Python، JavaScript، Ruby**.

### كيف تعمل Python بدقة؟
التبسيط أعلاه مفيد، لكن الحقيقة أدق قليلاً، ومن الجيد أن تعرفها كطالب جامعي:
1. عند تشغيل \`python grades.py\`، يفحص Python الملف كاملاً أولاً ويحوله إلى صيغة وسيطة اسمها **Bytecode**. **أخطاء القواعد (SyntaxError) تظهر في هذه المرحلة**، قبل تنفيذ أي سطر.
2. ثم تقوم **آلة Python الافتراضية (Python Virtual Machine)** بتنفيذ Bytecode تعليمة تعليمة.
3. **الأخطاء أثناء التشغيل** (مثل القسمة على صفر أو متغير غير معرف) تظهر عند الوصول إليها فقط، فالأسطر التي قبلها تكون قد نُفذت.

لهذا نقول عن Python إنها "لغة مفسرة"، مع أن فيها خطوة ترجمة داخلية إلى Bytecode. وJava تعمل بطريقة مشابهة: تُترجم إلى Bytecode ثم تُنفذ على آلة JVM.

جمة."},{t:"tf",q:"المفسر ينتج ملفاً تنفيذياً مستقلاً يمكن تشغيله بدونه.",a:!1,why:"المفسر ينفذ مباشرة ويجب أن يكون موجوداً عند التشغيل."},{t:"mcq",q:"في Python، برنامج فيه print صحيح في السطر 1 وقسمة على صفر في السطر 2. ماذا يحدث؟",o:["لا يُطبع شيء","يُطبع السطر 1 ثم يظهر الخطأ","يظهر الخطأ ثم يُطبع السطر 1","تُتجاهل القسمة"],a:1,why:"القسمة على صفر خطأ وقت تشغيل، يظهر عند الوصول إليه بعد تنفيذ ما قبله."},{t:"mcq",q:"في Python، برنامج فيه print صحيح في السطر 1 وقوس غير مغلق في السطر 2. ماذا يحدث؟",o:["يُطبع السطر 1 ثم يظهر الخطأ","يظهر SyntaxError ولا يُنفذ أي سطر","يُكمل البرنامج عادياً","يُصلح Python الخطأ تلقائياً"],a:1,why:"Python يفحص قواعد الملف كاملاً قبل التنفيذ.",f:["هذا يحدث مع أخطاء وقت التشغيل، لا أخطاء القواعد."]},{t:"fill",q:"الصيغة الوسيطة التي تحول Python الكود إليها قبل تنفيذه تسمى ______.",a:["bytecode","Bytecode","byte code"],why:"Bytecode."}],exercise:{kind:"open",task:"اشرح لصديق لا يعرف البرمجة الفرق بين المترجم والمفسر باستخدام تشبيه من اختيارك (غير تشبيه الكتاب والمؤتمر).",solution:'**مثال:** المترجم مثل **طباخ يحضّر وجبات مجمدة**: يطبخ كل شيء مسبقاً ويغلفه، فتسخنه في دقيقة متى شئت دون الحاجة إليه. لكن لو أردت تغيير الملح، يجب أن يعيد طبخ الدفعة كلها. المفسر مثل **طباخ في مطعم مفتوح**: يطبخ طلبك أمامك خطوة خطوة؛ أبطأ قليلاً، لكنك تستطيع أن تقول "ملح أقل" فيغيّر فوراً.'},sources:["pydocs","cs50x"]},{id:"p4",unit:"programming",title:"Syntax وLogic وDebugging: الأخطاء وكيف نصلحها",en:"Syntax, Logic and Debugging",level:2,minutes:30,prereq:["p3"],goals:["تميّز بين **قواعد اللغة (Syntax)** و**منطق البرنامج (Logic)**.","تعرف الأنواع الثلاثة للأخطاء: Syntax Errors، Runtime Errors، Logic Errors.","تتعلم خطوات **التصحيح (Debugging)** المنهجية."],body:`### Syntax: قواعد الكتابة
**الصياغة (Syntax)** هي قواعد كتابة اللغة: أين توضع الأقواس، علامات التنصيص، النقطتان، المسافات. مثل قواعد الإملاء والنحو في العربية.

في العربية، "ذهبَ الطالبُ إلى الجامعةِ" صحيحة، و"الجامعةِ إلى ذهبَ" خطأ نحوي. في Python:
- \`print("مرحبا")\` صحيحة.
- \`print("مرحبا"\` خطأ: القوس لم يُغلق.

### Logic: منطق الحل
**المنطق (Logic)** هو صحة فكرة الحل نفسها. قد تكون الجملة صحيحة نحوياً لكن معناها خطأ: "الشمس تشرق من الغرب" سليمة نحوياً وخاطئة منطقياً.

في البرمجة: إذا أردت حساب متوسط رقمين وكتبت:

\`\`\`python
average = 10 + 20 / 2
\`\`\`

الكود صحيح القواعد ويعمل، لكنه يعطي **20** بدل **15**! لأن القسمة تُنفذ قبل الجمع (كما في الرياضيات)، فصار الحساب 10 + 10. الحل الصحيح: \`(10 + 20) / 2\`.

### الأنواع الثلاثة للأخطاء
| النوع | متى يظهر؟ | هل يخبرك Python؟ | مثال |
|---|---|---|---|
| **خطأ صياغة** Syntax Error | قبل التشغيل | نعم، برسالة SyntaxError | نسيان قوس أو نقطتين |
| **خطأ وقت التشغيل** Runtime Error | أثناء التشغيل | نعم، يتوقف البرنامج برسالة | قسمة على صفر، متغير غير معرف |
| **خطأ منطقي** Logic Error | لا يظهر أبداً كرسالة | **لا!** البرنامج يعمل لكن النتيجة خاطئة | المتوسط الخاطئ أعلاه |

الأخطاء المنطقية هي **الأخطر** لأنها صامتة. لذلك يجب أن تختبر برامجك بأمثلة تعرف نتيجتها مسبقاً.

### Debugging: صيد الأخطاء
**التصحيح (Debugging)** هو عملية إيجاد الأخطاء وإصلاحها. الاسم له قصة شهيرة: عام 1947 وجد فريق يعمل على حاسوب Harvard Mark II عثة (Bug) عالقة في الجهاز وسجّلوها في دفتر العمل. كلمة Bug كانت تُستخدم للأعطال قبل ذلك، لكن هذه الحادثة جعلتها مشهورة.

### خطوات التصحيح المنهجية
1. **اقرأ رسالة الخطأ كاملة**. أهم معلومتين: **نوع الخطأ** و**رقم السطر**. المبتدئون يتجاهلون الرسالة، والمحترفون يبدؤون بها.
2. **أعد إنتاج الخطأ**: هل يحدث دائماً؟ مع أي مدخلات؟
3. **ضيّق المكان**: أين تختلف القيم الفعلية عن المتوقعة؟ أبسط أداة: \`print()\` لعرض قيم المتغيرات في منتصف البرنامج.
4. **كوّن فرضية**: "أعتقد أن المشكلة في ترتيب العمليات".
5. **عدّل شيئاً واحداً فقط** ثم اختبر.
6. **اختبر من جديد** بعدة أمثلة، منها الحالات الحدية (صفر، قيم سالبة، قائمة فارغة).

> **تقنية البطة المطاطية (Rubber Duck Debugging)**: اشرح كودك سطراً سطراً بصوت عالٍ لأي شيء، حتى لبطة بلاستيكية. كثيراً ما تكتشف الخطأ وأنت تشرح.

نظرياً يمكنك كتابة الكود في Notepad. لكن المبرمجين يستخدمون أدوات تسهّل عملهم كثيراً.

**بيئة التطوير المتكاملة (Integrated Development Environment – IDE)** برنامج يجمع كل ما يحتاجه المبرمج في مكان واحد:
- **محرر نصوص** ذكي مع **تلوين الصياغة (Syntax Highlighting)**: الكلمات المحجوزة بلون والنصوص بلون، فتلاحظ الخطأ بصرياً.
- **الإكمال التلقائي (Autocomplete)**: يقترح أسماء الدوال والمتغيرات.
- **تشغيل الكود** بزر واحد.
- **منقح الأخطاء (Debugger)**: يوقف البرنامج عند سطر محدد لترى قيم المتغيرات.
- **طرفية (Terminal)** مدمجة.

### VS Code
**Visual Studio Code** محرر مجاني مفتوح المصدر من Microsoft، وهو الأكثر استخداماً بين المطورين حالياً وفق استطلاعات المطورين السنوية. تقنياً هو "محرر" وليس IDE كاملاً، لكن بتثبيت **الإضافات (Extensions)** يصبح بيئة متكاملة لأي لغة. لا تخلط بينه وبين **Visual Studio** (برنامج آخر أثقل من Microsoft).

بدائل ستسمع عنها: **PyCharm** (IDE متخصص بـ Python)، و**Jupyter Notebook** و**Google Colab** (دفاتر تفاعلية شائعة جداً في الذكاء الاصطناعي، سنشرحها في وحدة الأدوات).

### خطوات التثبيت على جهازك
1. **ثبّت Python**: من الموقع الرسمي python.org، حمّل أحدث إصدار من Python 3. **مهم في Windows**: فعّل خيار **"Add python.exe to PATH"** في أول شاشة للتثبيت.
2. **تحقق من التثبيت**: افتح الطرفية (Command Prompt في Windows أو Terminal في macOS) واكتب \`python --version\` (أو \`python3 --version\` في macOS وLinux). يجب أن يظهر رقم الإصدار.
3. **ثبّت VS Code**: من code.visualstudio.com.
4. **ثبّت إضافة Python**: داخل VS Code افتح قسم الإضافات (Extensions)، وابحث عن "Python" من Microsoft.
5. **أنشئ مجلداً لمشاريعك**، مثلاً \`ai-study\`، وافتحه في VS Code عبر File ← Open Folder.

### أول برنامج
تقليد عمره عقود: أول برنامج في أي لغة يطبع **"Hello, World!"**. في VS Code:
1. أنشئ ملفاً جديداً باسم \`hello.py\`.
2. اكتب فيه الكود أدناه.
3. اضغط زر التشغيل ▷ في الأعلى، أو اكتب في الطرفية: \`python hello.py\`.

لا تحتاج إلى تثبيت أي شيء لتجربته الآن: هذا المحرر يشغّل Python حقيقية داخل متصفحك. اضغط "تشغيل"، ثم غيّر النص وشغّل من جديد:

`first name` خطأ.\n- **حساس لحالة الأحرف**: `Age` و`age` متغيران مختلفان.\n- لا يكون كلمة محجوزة في اللغة مثل `if` و`for` و`class`.\n\n### أعراف التسمية (مستحسنة)\n- استخدم أسماء **ذات معنى**: `total_price` أفضل من `x` و`tp`.\n- في Python العرف هو **snake_case**: كلمات صغيرة بينها شرطة سفلية (وفق دليل الأسلوب الرسمي PEP 8).\n- يمكن تقنياً استخدام أسماء عربية للمتغيرات في Python 3، لكن الأعراف المهنية والجامعية تستخدم الإنجليزية.\n\n### جرّب\n[[sim:run:vars]]',terms:[{en:"Variable",ar:"المتغير",def:"اسم مرتبط بقيمة في الذاكرة يمكن تغييرها."},{en:"Assignment",ar:"الإسناد",def:"ربط قيمة باسم باستخدام =."},{en:"Value",ar:"القيمة",def:'البيانات المخزنة: 18، "Ali"…'},{en:"Identifier",ar:"المعرّف",def:"اسم المتغير أو الدالة."},{en:"Keyword",ar:"الكلمة المحجوزة",def:"كلمة لها معنى خاص في اللغة مثل if."},{en:"snake_case",ar:"أسلوب الأفعى",def:"كتابة الأسماء بحروف صغيرة وشرطات سفلية."},{en:"Object",ar:"الكائن",def:"كل قيمة في Python كائن في الذاكرة له نوع."}],reallife:"في تطبيق البنك، رصيدك متغير اسمه مثلاً `balance`. عند الإيداع: `balance = balance + amount`. عند السحب: `balance = balance - amount`. الكود نفسه يخدم ملايين العملاء، وقيمة المتغير تختلف لكل واحد.",analogy:'المتغير مثل **خانة في جهات الاتصال**: الاسم "أمي" ثابت، والرقم المرتبط به يمكن تحديثه. عندما تتصل لا تكتب الرقم، بل تختار الاسم. وإذا غيرت أمك رقمها، تحدّث الخانة مرة واحدة فتتصل بالرقم الجديد في كل مرة.',codes:[{code:`name = "Muhammad"

ue` | `2` | داخلياً True تُعامل كـ 1 و False كـ 0 |\n\n### Python ديناميكية الأنواع\nفي Python لا تكتب النوع عند إنشاء المتغير؛ تستنتجه من القيمة. ويمكن أن يحمل المتغير نفسه نوعاً مختلفاً لاحقاً. هذا يسمى **الكتابة الديناميكية (Dynamic Typing)**. في C وJava يجب إعلان النوع: `int age = 18;`، وهذا يسمى **الكتابة الثابتة (Static Typing)**.\n\n### جرّب\n[[sim:run:types]]',terms:[{en:"Data Type",ar:"نوع البيانات",def:"تصنيف يحدد شكل التخزين والعمليات المسموحة."},{en:"Integer (int)",ar:"عدد صحيح",def:"عدد بلا كسور."},{en:"Float",ar:"عدد عشري",def:"عدد بفاصلة عشرية."},{en:"String (str)",ar:"سلسلة نصية",def:"نص بين علامتي تنصيص."},{en:"Boolean (bool)",ar:"قيمة منطقية",def:"True أو False."},{en:"Concatenation",ar:"الربط / الدمج",def:"وصل نصين بالعلامة +."},{en:"Dynamic Typing",ar:"الكتابة الديناميكية",def:"النوع يُحدد من القيمة وقت التشغيل."},{en:"TypeError",ar:"خطأ النوع",def:"عملية على أنواع غير متوافقة."}],reallife:'في استمارة التسجيل الجامعي: الاسم **str**، العمر **int**، المعدل **float**، "هل أنت من سكان الأقسام الداخلية؟" **bool**. ورقم الهاتف؟ رغم أنه أرقام، نخزنه غالباً **str**، لأننا لا نجري عليه عمليات حسابية، ولأن الصفر في بدايته يجب أن يبقى: 0770… كرقم int سيضيع الصفر!',analogy:'الأنواع مثل **أوانٍ مختلفة في المطبخ**: الماء (float) يوضع في إبريق، والبيض (int) يُعدّ بالحبة، والوصفة المكتوبة (str) على ورقة، ومفتاح الفرن (bool) مشغل أو مطفأ. لا تستطيع "جمع" ورقة الوصفة مع البيض؛ يجب أن تقرر ماذا تقصد أولاً.',codes:[{code:`age = 18

المُحث / رسالة الطلب",def:"النص الذي يظهر للمستخدم ليعرف ماذا يدخل."},{en:"Type Conversion / Casting",ar:"تحويل النوع",def:'تغيير قيمة من نوع لآخر مثل int("5").'},{en:"ValueError",ar:"خطأ القيمة",def:"قيمة لا تصلح للتحويل المطلوب."},{en:"Nested Call",ar:"استدعاء متداخل",def:"دالة داخل دالة، تُنفذ الداخلية أولاً."}],reallife:'تطبيق آلة حاسبة الهاتف: كل ما تضغطه على الأزرار يصل كـ"نص" (رموز)، والتطبيق يحوّله إلى أرقام قبل الحساب. ونماذج الذكاء الاصطناعي تفعل الشيء نفسه: كل مدخل (نص، صورة) يُحول أولاً إلى أرقام.',analogy:'`input()` مثل **موظف استقبال يدوّن كل شيء على ورقة**، حتى لو قلت له رقماً. إذا أردت الحساب بالرقم، يجب أن "تقرأ" الورقة وتحولها إلى رقم في ذهنك أولاً. هذا ما تفعله `int()`.',codes:[{code:`name = input("ما اسمك؟ ")

nتجمع عدة شروط:\n| العامل | يعطي True عندما… | مثال |\n|---|---|---|\n| `and` | **كلا** الشرطين صحيح | `age >= 18 and has_id` |\n| `or` | **أحد** الشرطين على الأقل صحيح | `is_weekend or is_holiday` |\n| `not` | يعكس القيمة | `not is_raining` |\n\n**جدول الحقيقة (Truth Table)** للعاملين and وor:\n| A | B | A and B | A or B |\n|---|---|---|---|\n| True | True | True | True |\n| True | False | False | True |\n| False | True | False | True |\n| False | False | False | False |\n\n### عوامل الإسناد المختصرة\n`x += 5` تعني `x = x + 5`. وكذلك `-=` و`*=` و`/=`. ستستخدمها كثيراً في الحلقات.\n\n### جرّب\n[[sim:run:ops]]',terms:[{en:"Operator",ar:"العامل",def:"رمز ينفذ عملية مثل + أو ==."},{en:"Operand",ar:"المعامل",def:"القيمة التي يعمل عليها العامل."},{en:"Modulo (%)",ar:"باقي القسمة",def:"ما يتبقى بعد القسمة الصحيحة."},{en:"Floor Division (//)",ar:"القسمة الصحيحة",def:"القسمة مع حذف الكسر (تقريب للأسفل)."},{en:"Exponent (**)",ar:"الأس",def:"رفع عدد لقوة."},{en:"Comparison Operator",ar:"عامل المقارنة",def:"يقارن قيمتين ويعطي True أو False."},{en:"Logical Operator",ar:"العامل المنطقي",def:"and وor وnot لجمع الشروط."},{en:"Operator Precedence",ar:"أولوية العوامل",def:"ترتيب تنفيذ العمليات."},{en:"Truth Table",ar:"جدول الحقيقة",def:"جدول نواتج العوامل المنطقية لكل الاحتمالات."}],reallife:'شروط القبول في منحة: "المعدل 90 أو أكثر **و** العمر أقل من 22، **أو** الطالب من أوائل المحافظة". هذه جملة منطقية بالضبط: `(gpa >= 90 and age < 22) or is_top`. محركات البحث وفلاتر التسوق ("السعر أقل من 50 ألف **و** التقييم 4 نجوم فأكثر") تعمل بالعوامل نفسها.',analogy:"**and مثل بوابة بقفلين**: لا تُفتح إلا إذا كان معك المفتاحان. **or مثل باب بمدخلين**: يكفيك أحدهما. **not مثل مفتاح إضاءة**: يقلب الحالة. والعامل % مثل **توزيع الحلوى**: 17 حبة على 5 أطفال، كل طفل يأخذ 3 (//) ويبقى 2 (%).",codes:[{code:`minutes = 135

حتى الآن، كل برامجنا تنفذ كل الأسطر بالترتيب. لكن الحياة مليئة بالقرارات: إذا كانت الدرجة 50 فأكثر، فالطالب ناجح، وإلا فراسب. هذا ما تسميه الخوارزميات **الاختيار (Selection)**، وفي Python نكتبه بـ \`if\`.

### البنية الأساسية
\`\`\`python
if condition:
    # كتلة تُنفذ فقط إذا كان الشرط True
\`\`\`
ثلاثة أشياء إلزامية:
1. الكلمة \`if\` ثم **شرط** يعطي True أو False.
2. **النقطتان \`:\`** في نهاية السطر.
3. **مسافة بادئة** (4 مسافات) قبل كل سطر تابع للشرط.

### المسافة البادئة (Indentation) ليست زينة!
في لغات مثل C وJava تُحدد الكتل بالأقواس \`{ }\`. في Python **المسافات نفسها** تحدد أي الأسطر تتبع \`if\`. الأسطر التي بنفس المسافة تشكل **كتلة (Block)** واحدة. والسطر الذي يعود إلى بداية السطر يعني أن الكتلة انتهت.

### if ... else
\`\`\`python
if grade >= 50:
    print("ناجح")
else:
    print("راسب")
\`\`\`
\`else\` تعني "في كل الحالات الأخرى"، ولا تأخذ شرطاً.

### if ... elif ... else
عندما توجد أكثر من حالتين نستخدم \`elif\` (اختصار else if):
\`\`\`python
if grade >= 90:
    print("امتياز")
elif grade >= 80:
    print("جيد جداً")
elif grade >= 50:
    print("ناجح")
else:
    print("راسب")
\`\`\`
**مهم جداً**: Python تفحص الشروط **بالترتيب من الأعلى**، وتنفذ **أول** فرع صحيح فقط، ثم تتخطى الباقي. لذلك الدرجة 95 تطبع "امتياز" فقط، رغم أنها تحقق أيضاً \`>= 80\` و\`>= 50\`.

### شاهد التنفيذ
[[sim:trace:ifelse]]

### الشروط المتداخلة (Nested Conditions)
يمكن وضع \`if\` داخل \`if\`:
\`\`\`python
if grade >= 50:
    if attendance >= 75:
        print("ناجح")
    else:
        print("محروم بسبب الغياب")
else:
    print("راسب")
\`\`\`
لكن التداخل العميق يصعّب القراءة. غالباً يمكن تبسيطه بـ \`and\`.

اطبع الأرقام من 1 إلى 5:
\`\`\`python
print(1)
print(2)
print(3)
print(4)
print(5)
\`\`\`
والآن من 1 إلى 10,000؟ مستحيل يدوياً. **الحلقة (Loop)** تكرر كتلة كود عدة مرات. في علم الخوارزميات تسمى **التكرار (Iteration)**، وهي مع التسلسل والاختيار المكونات الثلاثة لأي خوارزمية.

### الحلقة for
تمر على عناصر مجموعة، عنصراً عنصراً:
\`\`\`python
for n in [4, 7, 1]:
    print(n)
\`\`\`
في كل **دورة (Iteration)** يأخذ المتغير \`n\` قيمة العنصر التالي، ثم تُنفذ الكتلة.

### الدالة range()
تولّد سلسلة أرقام:
| الاستدعاء | الأرقام |
|---|---|
| \`range(5)\` | 0، 1، 2، 3، 4 |
| \`range(1, 6)\` | 1، 2، 3، 4، 5 |
| \`range(0, 10, 2)\` | 0، 2، 4، 6، 8 |
| \`range(5, 0, -1)\` | 5، 4، 3، 2، 1 |

**القاعدة**: تبدأ من الأول، و**تتوقف قبل** الثاني (لا تشمله). range(1, 6) تنتهي عند 5.

### شاهد for وهي تجمع
لاحظ كيف يتغير \`total\` و\`n\` في كل دورة. هذا نمط **المُراكِم (Accumulator)**: متغير يبدأ من صفر ويتراكم فيه شيء.

### الحلقة while
تكرر **ما دام** الشرط صحيحاً:
\`\`\`python
count = 3
while count > 0:
    print(count)
    count = count - 1
\`\`\`
قبل كل دورة يُفحص الشرط. عندما يصبح False تتوقف الحلقة.

[[sim:trace:whileloop]]

### متى أستخدم أيهما؟
- **for**: عندما تعرف **ماذا** ستكرر عليه أو **كم مرة**: كل عنصر في قائمة، أو 10 مرات.
- **while**: عندما لا تعرف عدد المرات، بل تعرف **شرط التوقف**: "اطلب كلمة المرور حتى تكون صحيحة"، "استمر في التدريب حتى يصبح الخطأ صغيراً".

### الحلقة اللانهائية (Infinite Loop)
إذا لم يتغير شيء داخل while يجعل الشرط False يوماً، ستعمل الحلقة إلى الأبد:
\`\`\`python
x = 1
while x > 0:
    print(x)    # نسينا تغيير x!
\`\`\`
في المختبر نوقف البرنامج تلقائياً بعد 10 ثوانٍ. على جهازك اضغط **Ctrl + C**.

### break وcontinue
- \`break\`: اخرج من الحلقة فوراً.
- \`continue\`: تخطَّ بقية هذه الدورة وانتقل للتالية.
\`\`\`python
for n in range(1, 10):
    if n == 5:
        break        # يتوقف عند 5
    if n % 2 == 0:
        continue     # يتخطى الأعداد الزوجية
    print(n)         # يطبع 1 و 3
\`\`\`

تخيل أنك تحسب المعدل في عشرة أماكن من برنامجك. لو كتبت الحساب عشر مرات، ثم اكتشفت خطأً فيه، ستصلحه عشر مرات. **الدالة (Function)** تسمح بكتابة الكود **مرة واحدة**، وإعطائه **اسماً**، واستدعائه متى شئت.

فوائد الدوال:
- **إعادة الاستخدام (Reusability)**: اكتب مرة، استخدم كثيراً.
- **التنظيم**: تقسيم البرنامج الكبير إلى قطع صغيرة واضحة (تذكر "التحليل" من الوحدة الثانية).
- **التجريد**: تستخدم \`print\` دون أن تعرف كيف تعمل داخلياً. ودوالك ستعمل بالطريقة نفسها.
- **سهولة الاختبار**: تختبر كل دالة وحدها.

### تعريف دالة
\`\`\`python
def greet(name):
    print("أهلاً", name)
\`\`\`
- \`def\` (اختصار define): نعرّف دالة.
- \`greet\`: اسم الدالة (بنفس قواعد أسماء المتغيرات).
- \`(name)\`: **المعامل (Parameter)**: متغير يستقبل القيمة عند الاستدعاء.
- النقطتان والمسافة البادئة: جسم الدالة.

**التعريف لا ينفذ شيئاً!** هو يحفظ "الوصفة" فقط. التنفيذ يحدث عند **الاستدعاء (Call)**:
\`\`\`python
greet("Sara")     # "Sara" هنا وسيط (Argument)
\`\`\`

### المعامل والوسيط
- **المعامل (Parameter)**: الاسم في التعريف: \`name\`.
- **الوسيط (Argument)**: القيمة الفعلية عند الاستدعاء: \`"Sara"\`.

### return: إعادة النتيجة
\`print\` تعرض النتيجة على الشاشة فقط. أما \`return\` **فتعيد** القيمة إلى من استدعى الدالة، ليخزنها أو يستخدمها في حساب آخر:
\`\`\`python
def area(width, height):
    return width * height

room = area(4, 5)          # room = 20
total = area(4, 5) + area(2, 3)   # 20 + 6 = 26
\`\`\`
عند الوصول إلى \`return\` **تنتهي الدالة فوراً**. والدالة التي لا تحتوي return تعيد القيمة الخاصة \`None\`.

### شاهد الاستدعاء
[[sim:trace:function]]

### print أم return؟
هذا أهم تمييز في الدرس:
| | print | return |
|---|---|---|
| ماذا تفعل؟ | تعرض على الشاشة | تعيد القيمة للمستدعي |
| هل يمكن استخدام النتيجة في حساب؟ | لا | نعم |
| هل تُنهي الدالة؟ | لا | نعم |

القاعدة العملية: **اجعل الدوال تعيد النتائج بـ return**، واطبع خارجها. هكذا تبقى الدالة مفيدة في أي سياق.

### القيم الافتراضية للمعاملات
\`\`\`python
def greet(name, stage=1):
    return f"أهلاً {name}، طالب المرحلة {stage}"
\`\`\`
إذا لم تمرر \`stage\` تُستخدم 1. (و\`f"..."\` اسمها **f-string**: نص تضع فيه متغيرات بين \`{ }\`.)

### نطاق المتغيرات (Scope)
المتغيرات المعرّفة **داخل** الدالة **محلية (Local)**: تولد عند الاستدعاء وتختفي عند انتهائه، ولا تُرى من الخارج. هذا يمنع الدوال من العبث بمتغيرات بعضها.

### إنشاء قائمة
\`\`\`python
marks = [80, 65, 92]

mixed = [1, "two", 3.0, True]   # مسموح، لكن نادر

\`\`\`
أقواس مربعة، والعناصر مفصولة بفواصل.

### الفهرسة (Indexing): العد يبدأ من الصفر!
| العنصر | 80 | 65 | 92 |
|---|---|---|---|
| الفهرس | 0 | 1 | 2 |
| الفهرس السالب | -3 | -2 | -1 |

- \`marks[0]\` ← 80 (الأول)
- \`marks[-1]\` ← 92 (الأخير، مهما كان طول القائمة)
- \`marks[3]\` ← **IndexError**: لا يوجد عنصر رابع.

**لماذا من الصفر؟** لأن الفهرس في الأصل "الإزاحة" عن بداية القائمة في الذاكرة: العنصر الأول على بعد 0 خانة من البداية. (ستفهم هذا أكثر في وحدة هياكل البيانات.)

### التقطيع (Slicing)
\`marks[start:stop]\` تعطي قائمة جزئية، وكالعادة \`stop\` غير مشمول:
- \`marks[0:2]\` ← [80, 65]
- \`marks[1:]\` ← من الثاني حتى النهاية
- \`marks[:2]\` ← أول عنصرين

### القوائم قابلة للتعديل (Mutable)
\`\`\`python
marks[1] = 68           # تعديل
marks.append(70)        # إضافة في النهاية
marks.insert(0, 99)     # إضافة في موقع محدد
marks.remove(92)        # حذف أول ظهور للقيمة
last = marks.pop()      # حذف آخر عنصر وإعادته
\`\`\`

### دوال وعمليات مفيدة
| الكود | الوظيفة |
|---|---|
| \`len(marks)\` | عدد العناصر |
| \`sum(marks)\` | المجموع (للأرقام) |
| \`max(marks)\` / \`min(marks)\` | الأكبر / الأصغر |
| \`sorted(marks)\` | نسخة جديدة مرتبة |
| \`marks.sort()\` | ترتيب القائمة نفسها |
| \`92 in marks\` | هل القيمة موجودة؟ (True/False) |
| \`marks.index(92)\` | فهرس أول ظهور للقيمة |
| \`marks.count(80)\` | عدد مرات الظهور |

### المرور على القائمة

**الخوارزمية (Algorithm)** مجموعة **محددة ومرتبة** من الخطوات **الواضحة** التي تحل مشكلة أو تنجز مهمة، **وتنتهي** بعد عدد محدود من الخطوات.

الكلمة مشتقة من اسم العالم المسلم **محمد بن موسى الخوارزمي** (القرن التاسع الميلادي)، الذي عمل في بيت الحكمة ببغداد، وكان لكتبه في الحساب والجبر أثر كبير في انتقال طرق الحساب بالأرقام الهندية العربية إلى أوروبا، حيث تحوّل اسمه في اللاتينية إلى Algoritmi.

### خصائص الخوارزمية الجيدة
1. **المدخلات (Input)**: صفر أو أكثر من القيم تأتيها من الخارج.
2. **المخرجات (Output)**: نتيجة واحدة على الأقل.
3. **الوضوح (Definiteness)**: كل خطوة لها معنى واحد لا يحتمل التأويل.
4. **المحدودية (Finiteness)**: تنتهي بعد عدد محدود من الخطوات.
5. **الفعالية (Effectiveness)**: كل خطوة بسيطة يمكن تنفيذها فعلاً.

### لماذا نحتاج الخوارزميات؟
- لأن **التفكير في الحل منفصل عن كتابته**: الخوارزمية نفسها يمكن كتابتها بـ Python أو C++ أو Java.
- لأن المشكلة الواحدة لها **حلول عديدة بكفاءات مختلفة جداً**. البحث عن اسم في دليل هاتف بمليون اسم قد يحتاج مليون خطوة بطريقة، و20 خطوة فقط بطريقة أخرى (الدرس القادم).
- لأن **الذكاء الاصطناعي نفسه خوارزميات**: خوارزمية التدريب، خوارزمية البحث في الألعاب، خوارزمية ترتيب نتائج البحث.

### الخوارزمية مقابل البرنامج
| | الخوارزمية | البرنامج |
|---|---|---|
| ما هي؟ | فكرة الحل وخطواته | تنفيذ الخوارزمية بلغة برمجة |
| اللغة | أي لغة: عربية، Pseudocode، رسم | لغة برمجة محددة |
| هل تعمل على الحاسوب؟ | لا مباشرة | نعم |
| مثال | "قارن كل عنصر بالهدف حتى تجده" | دالة linear_search بـ Python |

### كيف نفكر لحل مشكلة؟
1. **افهم المشكلة**: ما المدخلات؟ ما المخرجات المطلوبة؟ ما القيود؟
2. **جرّب يدوياً** على مثال صغير، ولاحظ ما تفعله أنت.
3. **اكتب الخطوات** بلغة دقيقة (Pseudocode).
4. **تتبّع الخوارزمية** على أمثلة، منها الحالات الحدية.
5. **حوّلها إلى كود**، ثم اختبرها.

### الكود الزائف (Pseudocode)
وصف للخوارزمية بلغة قريبة من البرمجة لكن **بلا قواعد صارمة**. هدفه التواصل بين البشر. لا توجد صيغة "رسمية" واحدة، وأساتذتك قد يستخدمون أساليب مختلفة قليلاً:

\`\`\`text
ALGORITHM PassOrFail
INPUT: grade
IF grade >= 50 THEN
    OUTPUT "ناجح"
ELSE
    OUTPUT "راسب"
END IF
\`\`\`

1. **التسلسل (Sequence)**: خطوات تُنفذ واحدة بعد الأخرى بالترتيب. (كل الأسطر بلا شروط.)

لديك قائمة أرقام (أو أسماء)، وتريد معرفة: هل القيمة \`target\` موجودة؟ وأين؟ هذه من أكثر العمليات تكراراً في الحوسبة: البحث عن مستخدم، عن ملف، عن كلمة.

### البحث الخطي (Linear Search)
أبسط فكرة: **ابدأ من الأول، وقارن كل عنصر بالهدف، حتى تجده أو تنتهي القائمة.**

\`\`\`text
FOR i FROM 0 TO n - 1
    IF items[i] == target THEN RETURN i
RETURN -1     (غير موجود)
\`\`\`

- **يعمل على أي قائمة**، مرتبة أو لا.
- **أفضل حالة**: الهدف أول عنصر ← مقارنة واحدة.
- **أسوأ حالة**: الهدف آخر عنصر أو غير موجود ← n مقارنة.

### البحث الثنائي (Binary Search)
إذا كانت القائمة **مرتبة**، نستطيع أن نكون أذكى بكثير. افتح دليل الهاتف من المنتصف: إذا كان الاسم الذي تبحث عنه يأتي أبجدياً **قبل** صفحة المنتصف، **تخلص من النصف الثاني كله**. كرر على النصف المتبقي.

\`\`\`text
lo ← 0 ، hi ← n - 1
WHILE lo <= hi
    mid ← (lo + hi) // 2
    IF items[mid] == target THEN RETURN mid
    ELSE IF items[mid] < target THEN lo ← mid + 1   (ابحث في اليمين)
    ELSE hi ← mid - 1                               (ابحث في اليسار)
RETURN -1
\`\`\`

في كل خطوة **يتقلص نطاق البحث إلى النصف**. لذلك:
| حجم القائمة n | البحث الخطي (أسوأ حالة) | البحث الثنائي (أسوأ حالة) |
|---|---|---|
| 16 | 16 | 5 |
| 1,000 | 1,000 | 10 |
| 1,000,000 | 1,000,000 | 20 |
| مليار | مليار | 30 |

عدد خطوات البحث الثنائي يقارب **log₂(n)**: كم مرة نقسم n على 2 حتى نصل إلى 1.

### الثمن: الترتيب
البحث الثنائي يحتاج قائمة **مرتبة**. الترتيب نفسه له تكلفة (الدرس القادم). لذلك:
- إذا كنت ستبحث **مرة واحدة** في قائمة غير مرتبة: البحث الخطي.
- إذا كنت ستبحث **آلاف المرات** في البيانات نفسها: رتّبها مرة واحدة، ثم استخدم البحث الثنائي.

- **البحث الأسرع**: البحث الثنائي يحتاج قائمة مرتبة.
- **العرض للبشر**: الطلاب حسب المعدل، المنتجات حسب السعر.
- **اكتشاف الأنماط**: إيجاد الوسيط (Median)، أو التكرارات.

الترتيب من أكثر المشكلات دراسة في علوم الحاسوب. سنتعلم ثلاث خوارزميات **بسيطة** تبني الحدس، قبل أن تدرس الأسرع منها (Merge Sort وQuick Sort) في مادة الخوارزميات.

### 1. Bubble Sort (ترتيب الفقاعة)
**الفكرة**: مر على القائمة، وقارن **كل عنصرين متجاورين**، وبدّلهما إذا كانا بالترتيب الخاطئ. بعد الدورة الأولى، **أكبر عنصر "يطفو" إلى النهاية** مثل الفقاعة. كرر على الباقي.
- بعد الدورة k، آخر k عناصر في أماكنها النهائية.
- **تحسين**: إذا مرت دورة كاملة **دون أي تبديل**، فالقائمة مرتبة، فنتوقف مبكراً.

### 2. Selection Sort (ترتيب الاختيار)
**الفكرة**: ابحث عن **أصغر** عنصر في الجزء غير المرتب، وضعه في **أول** هذا الجزء (بتبديل واحد). كرر.
- عدد المقارنات ثابت تقريباً مهما كانت حالة القائمة.
- عدد التبديلات قليل: على الأكثر n − 1.

### 3. Insertion Sort (ترتيب الإدراج)
**الفكرة**: مثل ترتيب **أوراق اللعب في يدك**. الجزء الأيسر مرتب دائماً. خذ العنصر التالي، وأزحه يساراً حتى يصل إلى مكانه الصحيح بين العناصر المرتبة.
- **ممتاز للقوائم شبه المرتبة**: قد يحتاج مقارنة واحدة فقط لكل عنصر.
- لهذا تستخدمه خوارزميات ترتيب عملية مثل **Timsort** (المستخدمة في \`sorted()\` في Python) لترتيب المقاطع الصغيرة.

### شاهدها تعمل
اختر الخوارزمية، واضغط "الخطوة التالية" لتتبع كل مقارنة وتبديل. جرّب أيضاً "قائمة مرتبة مسبقاً" ولاحظ عدد المقارنات في كل خوارزمية:

[[sim:sort]]

### مقارنة
| | Bubble | Selection | Insertion |
|---|---|---|---|
| أسوأ حالة | O(n²) | O(n²) | O(n²) |
| أفضل حالة (قائمة مرتبة) | O(n) مع التوقف المبكر | O(n²) | O(n) |
| عدد التبديلات | كثير | قليل (≤ n−1) | متوسط |
| متى يناسب؟ | التعليم | عندما يكون التبديل مكلفاً | القوائم الصغيرة أو شبه المرتبة |

(سنشرح معنى O(n²) بالتفصيل في الدرس القادم: باختصار، مضاعفة حجم البيانات تضاعف الوقت أربع مرات.)

### في الواقع العملي
لن تكتب خوارزمية ترتيب بنفسك في المشاريع الحقيقية؛ ستستخدم \`sorted()\` أو \`.sort()\`، وهي أسرع بكثير (O(n log n)). لكن فهم هذه الخوارزميات **إلزامي في الجامعة والمقابلات**، لأنه يدربك على التفكير في الحلقات المتداخلة والكفاءة.`,terms:[{en:"Sorting",ar:"الترتيب",def:"إعادة ترتيب العناصر تصاعدياً أو تنازلياً."},{en:"Bubble Sort",ar:"ترتيب الفقاعة",def:"تبديل المتجاورين حتى يطفو الأكبر للنهاية."},{en:"Selection Sort",ar:"ترتيب الاختيار",def:"اختيار الأصغر ووضعه في أول الجزء غير المرتب."},{en:"Insertion Sort",ar:"ترتيب الإدراج",def:"إدراج كل عنصر في مكانه بين المرتبة قبله."},{en:"Swap",ar:"التبديل",def:"تبادل موقعي عنصرين."},{en:"Pass",ar:"الدورة / المرور",def:"مرور كامل على القائمة."},{en:"In-place",ar:"في المكان نفسه",def:"ترتيب دون قائمة إضافية."},{en:"Stable Sort",ar:"ترتيب مستقر",def:"يحافظ على ترتيب العناصر المتساوية."}],reallife:'عندما ترتب منتجات متجر إلكتروني "من الأرخص إلى الأغلى"، أو يرتب تطبيق البريد الرسائل حسب التاريخ، أو تعرض الجامعة قائمة الأوائل، هناك خوارزمية ترتيب تعمل. وفي الذكاء الاصطناعي: محرك البحث يرتب ملايين النتائج حسب "الصلة" التي يحسبها نموذج.',analogy:"**Bubble Sort** مثل طلاب يقفون في صف، وكل اثنين متجاورين يتبادلان المكان إذا كان الأطول أمام الأقصر، حتى يصل الأطول للنهاية. **Selection Sort** مثل مدرب يمر على الجميع ليختار الأقصر ويضعه أولاً، ثم يكرر. **Insertion Sort** مثل ترتيب أوراق اللعب: تسحب ورقة وتدخلها في مكانها بين ما في يدك.",codes:[{code:`def bubble_sort(nums):
    n = len(nums)

        swapped = False

            if nums[j] > nums[j + 1]:
                nums[j], nums[j + 1] = nums[j + 1], nums[j]

"البرنامج يعمل في ثانيتين" ليس مقياساً جيداً: يختلف الوقت حسب الجهاز، واللغة، والبيانات. نريد مقياساً **مستقلاً عن الجهاز** يجيب عن سؤال واحد:

> **عندما يكبر حجم المدخلات n، كيف ينمو عدد الخطوات؟**

هذا هو **التعقيد الزمني (Time Complexity)**. وبالمثل، **التعقيد المكاني (Space Complexity)** يقيس نمو **الذاكرة الإضافية** التي تحتاجها الخوارزمية.

### رمز Big O
**Big O** يصف **معدل النمو** في أسوأ حالة عادة، مع تجاهل الثوابت والحدود الصغيرة:
- خوارزمية تحتاج 3n + 5 خطوة ← **O(n)**. لماذا؟ لأن الـ 5 تصبح بلا قيمة عندما تكون n مليوناً، والثابت 3 لا يغير "شكل" النمو.
- خوارزمية تحتاج n² + 100n ← **O(n²)**، لأن n² تهيمن عندما تكبر n.

> **دقة أكاديمية**: Big O تعطي **حداً أعلى** لمعدل النمو. ستتعلم في مادة الخوارزميات أيضاً Ω (حد أدنى) وΘ (حد دقيق). في الاستخدام اليومي يُقصد بـ Big O غالباً أسوأ حالة.

### أشهر فئات التعقيد (من الأسرع إلى الأبطأ)
| الرمز | الاسم | المعنى عند مضاعفة n | مثال |
|---|---|---|---|
| O(1) | ثابت Constant | لا يتغير | \`items[5]\`، \`len(items)\` |
| O(log n) | لوغاريتمي | يزيد خطوة واحدة فقط | البحث الثنائي |
| O(n) | خطي Linear | يتضاعف | البحث الخطي، حلقة واحدة، \`sum\`، \`x in list\` |

### التعقيد المكاني (Space Complexity)
- Bubble Sort يرتب **في المكان نفسه** باستخدام متغيرات قليلة ← مساحة إضافية **O(1)**.
- \`sorted(items)\` ينشئ قائمة جديدة بحجم n ← مساحة إضافية **O(n)**.
- كثيراً ما توجد **مقايضة (Trade-off)**: تستطيع تسريع خوارزمية باستخدام ذاكرة أكثر (مثلاً تخزين نتائج سابقة).

تعلمت أن **البيانات** قيم خام. **هيكل البيانات (Data Structure)** هو **طريقة تنظيم** هذه البيانات في الذاكرة، مع **العمليات** المسموحة عليها (إضافة، حذف، بحث، وصول).

لماذا يهم التنظيم؟ تخيّل مكتبة فيها مليون كتاب:
- مكدسة عشوائياً على الأرض ← لإيجاد كتاب تفتش الكل: O(n).
- مرتبة على رفوف حسب الرقم ← تذهب مباشرة: O(1) أو O(log n).

نفس الكتب، تنظيم مختلف، سرعة مختلفة تماماً. **اختيار هيكل البيانات المناسب نصف حل المشكلة.**

### العلاقة بالخوارزميات
الخوارزمية والهيكل وجهان لعملة واحدة: البحث الثنائي **خوارزمية** لكنه يحتاج **هيكلاً** مرتباً. وعبارة مشهورة لعالم الحاسوب Niklaus Wirth جعلها عنواناً لكتابه: **Algorithms + Data Structures = Programs**.

### المصفوفة (Array)
**المصفوفة** أبسط هيكل: عناصر **من النوع نفسه** مخزنة في **خانات متجاورة** في الذاكرة.

لنفترض أن المصفوفة تبدأ عند العنوان 1000، وكل عنصر يأخذ 4 بايت:
| الفهرس | 0 | 1 | 2 | 3 |
|---|---|---|---|---|
| العنوان | 1000 | 1004 | 1008 | 1012 |
| القيمة | 12 | 7 | 30 | 21 |

لإيجاد العنصر ذي الفهرس i، يحسب الحاسوب: **العنوان = البداية + i × حجم العنصر**. عملية حسابية واحدة مهما كان حجم المصفوفة، لذلك **الوصول بالفهرس O(1)**. وهذا أيضاً **سبب بدء الفهرسة من الصفر**: العنصر الأول على "إزاحة" صفر من البداية!

### تكلفة الإدراج والحذف
لأن العناصر متجاورة، **إدراج عنصر في المنتصف** يتطلب إزاحة كل العناصر التي بعده خطوة لليمين، و**الحذف** يتطلب إزاحتها لليسار لسد الفراغ ← **O(n)**.

| العملية | التعقيد | لماذا؟ |
|---|---|---|
| الوصول بالفهرس \`a[i]\` | O(1) | حساب العنوان مباشرة |
| البحث عن قيمة (غير مرتبة) | O(n) | بحث خطي |
| الإضافة في النهاية \`append\` | O(1) في المتوسط | لا إزاحة |
| الإدراج/الحذف في البداية أو الوسط | O(n) | إزاحة العناصر |

### قائمة Python مقابل المصفوفة الكلاسيكية
- في **C**، حجم المصفوفة **ثابت** يُحدد عند الإنشاء، وكل العناصر من نوع واحد.
- **قائمة Python (list)** مصفوفة **ديناميكية (Dynamic Array)**: تكبر تلقائياً. عندما تمتلئ، تحجز Python مساحة أكبر وتنسخ العناصر، وتحجز مساحة إضافية مسبقاً، لهذا \`append\` سريع في المتوسط. وهي تخزن **مراجع** إلى الكائنات، فيمكن خلط الأنواع.
- **مصفوفات NumPy** أقرب إلى مصفوفات C: نوع واحد، متجاورة فعلاً، وهذا سر سرعتها الهائلة في الحساب العلمي والذكاء الاصطناعي.

المكدس والطابور **أنواع بيانات مجردة (Abstract Data Types – ADT)**: نعرّفها بـ**العمليات المسموحة** وقواعدها، لا بطريقة تخزينها. يمكن بناؤهما فوق مصفوفة أو فوق قائمة مترابطة. قوتهما في **القيود**: تمنعك من الوصول العشوائي، فتضمن ترتيباً معيناً للمعالجة.

### المكدس (Stack): آخر من يدخل أول من يخرج
**LIFO = Last In, First Out**. تخيّل كومة صحون: تضع الصحن الجديد في **الأعلى**، وتأخذ من **الأعلى**.

العمليات:
- \`push(x)\`: ضع x في القمة.
- \`pop()\`: أزل العنصر الذي في القمة وأعده.
- \`peek()\` أو \`top()\`: انظر إلى القمة دون إزالة.
- \`is_empty()\`: هل المكدس فارغ؟

كلها **O(1)**.

**تطبيقات حقيقية:**
- **زر التراجع (Undo)**: كل تعديل يُدفع في مكدس، والتراجع يسحب آخر تعديل.
- **زر الرجوع في المتصفح**.
- **مكدس الاستدعاءات (Call Stack)**: عندما تستدعي دالة دالة أخرى، يحفظ Python مكان العودة في مكدس. الخطأ RecursionError سببه امتلاء هذا المكدس.
- **التحقق من الأقواس المتوازنة**: \`( [ ] )\` صحيحة، و\`( ]\` خاطئة. هكذا يكتشف المفسر أخطاء الأقواس.

### الطابور (Queue): أول من يدخل أول من يخرج
**FIFO = First In, First Out**. مثل طابور الكافتيريا: من يصل أولاً يُخدم أولاً.

العمليات:
- \`enqueue(x)\`: أضف x في **النهاية (Rear)**.
- \`dequeue()\`: أزل العنصر من **المقدمة (Front)** وأعده.
- \`peek()\`: انظر إلى المقدمة.

**تطبيقات حقيقية:**
- **طابور الطباعة**: المستندات تُطبع بترتيب إرسالها.
- **الخوادم**: طلبات المستخدمين تنتظر في طابور.
- **نظام التشغيل**: العمليات تنتظر دورها في المعالج.
- **البحث بالعرض أولاً (BFS)**: خوارزمية بحث في المخططات تستخدم طابوراً، وستراها في CS50 AI.

كل متغير في برنامجك يعيش في **RAM** (تذكر الوحدة الأولى)، ويختفي عند انتهاء البرنامج. لكن تطبيق الجامعة يجب أن يتذكر الطلاب ودرجاتهم لسنوات. نحتاج **تخزيناً دائماً (Persistent Storage)** على وحدة التخزين.

### لماذا لا نستخدم ملفاً نصياً فقط؟
يمكن حفظ الطلاب في ملف \`students.txt\` أو \`students.csv\`. هذا جيد للبيانات الصغيرة، لكن مع نمو التطبيق تظهر مشكلات:
- **البحث بطيء**: لإيجاد طالب واحد تقرأ الملف كله.
- **التكرار والتناقض**: اسم القسم مكتوب في آلاف الأسطر، وتغييره يحتاج تعديلها كلها، ونسيان سطر يخلق تناقضاً.
- **التزامن**: ماذا لو عدّل موظفان الملف في اللحظة نفسها؟
- **الصلاحيات والأمان**: من يحق له رؤية الدرجات؟
- **سلامة البيانات**: ماذا لو انقطعت الكهرباء في منتصف الكتابة؟

### قاعدة البيانات (Database)
**قاعدة البيانات** مجموعة منظمة من البيانات المترابطة، مخزنة بطريقة تسمح بالوصول إليها وتعديلها بكفاءة.

### نظام إدارة قواعد البيانات (DBMS)
**DBMS (Database Management System)** هو **البرنامج** الذي يدير قاعدة البيانات: يخزن، ويبحث بسرعة (باستخدام **الفهارس Indexes**، وهي هياكل بيانات تشبه فكرة البحث الثنائي)، ويتحكم بالتزامن والصلاحيات، ويضمن سلامة البيانات عند الأعطال.

أمثلة: **SQLite** (مدمجة مع Python وفي كل هاتف تقريباً)، **PostgreSQL**، **MySQL**، **Microsoft SQL Server**، **Oracle**.

### النموذج العلائقي (Relational Model)
أشهر أنواع قواعد البيانات **العلائقية (Relational)**، اقترح نموذجها **Edgar F. Codd** في IBM عام 1970. البيانات فيها **جداول (Tables)**:

**جدول students**
| id 🔑 | name | dept_id | stage | gpa |
|---|---|---|---|---|
| 1001 | Ali Hassan | 1 | 1 | 88.5 |
| 1002 | Sara Ahmed | 1 | 1 | 92.0 |
| 1003 | Omar Khalid | 2 | 2 | 76.25 |

**جدول departments**
| id 🔑 | name |
|---|---|
| 1 | علوم الذكاء الاصطناعي |
| 2 | علوم الحاسوب |

- **الجدول (Table)**: مجموعة بيانات عن نوع واحد من الأشياء (طلاب، أقسام).
- **الصف (Row / Record)**: عنصر واحد: طالب واحد بكل بياناته.
- **العمود (Column / Field)**: خاصية واحدة لكل العناصر: الاسم، المعدل. لكل عمود **نوع بيانات** محدد.

### المفتاح الأساسي (Primary Key)
عمود (أو أكثر) **يميز كل صف بشكل فريد**. لا يتكرر ولا يكون فارغاً. هنا \`id\`. لماذا لا نستخدم الاسم؟ لأن طالبين قد يحملان الاسم نفسه.

### المفتاح الخارجي (Foreign Key)
عمود في جدول **يشير إلى المفتاح الأساسي في جدول آخر**. هنا \`students.dept_id\` يشير إلى \`departments.id\`. الفوائد:
- اسم القسم مكتوب **مرة واحدة**، فتغييره سهل ولا تناقض.
- قاعدة البيانات **تمنع** إدخال طالب برقم قسم غير موجود. هذا يسمى **السلامة المرجعية (Referential Integrity)**.

### SQL وNoSQL باختصار
- **SQL** هي اللغة القياسية للتعامل مع قواعد البيانات العلائقية (الدرس القادم).
- **NoSQL** اسم لعائلة قواعد بيانات غير جدولية: مستندات (MongoDB)، مفتاح-قيمة (Redis)، مخططات (Neo4j). تُستخدم عندما تكون البيانات غير منتظمة البنية أو ضخمة جداً وموزعة. لا يوجد "أفضل" مطلقاً؛ يُختار حسب طبيعة البيانات.`,terms:[{en:"Database",ar:"قاعدة البيانات",def:"مجموعة منظمة من البيانات المترابطة."},{en:"DBMS",ar:"نظام إدارة قواعد البيانات",def:"البرنامج الذي يدير قاعدة البيانات."},{en:"Persistent Storage",ar:"التخزين الدائم",def:"بيانات تبقى بعد انتهاء البرنامج."},{en:"Table",ar:"الجدول",def:"بيانات نوع واحد من الأشياء في صفوف وأعمدة."},{en:"Row / Record",ar:"الصف / السجل",def:"عنصر واحد بكل بياناته."},{en:"Column / Field",ar:"العمود / الحقل",def:"خاصية واحدة لكل الصفوف."},{en:"Primary Key",ar:"المفتاح الأساسي",def:"يميز كل صف بشكل فريد."},{en:"Foreign Key",ar:"المفتاح الخارجي",def:"يشير إلى مفتاح أساسي في جدول آخر."},{en:"Relational Database",ar:"قاعدة بيانات علائقية",def:"قاعدة بيانات من جداول مترابطة."},{en:"NoSQL",ar:"قواعد غير علائقية",def:"قواعد بيانات بنماذج غير جدولية."}],reallife:"عندما تسجل الدخول إلى بوابة الجامعة، يبحث النظام عن رقمك الجامعي (مفتاح أساسي) في جدول الطلاب، ثم يجلب درجاتك من جدول الدرجات (الذي فيه رقمك كمفتاح خارجي)، ثم يجلب أسماء المواد من جدول المواد. ثلاثة جداول، وصفحة واحدة تراها في جزء من الثانية.",analogy:"قاعدة البيانات مثل **أرشيف الجامعة المنظم**: كل خزانة جدول (طلاب، أقسام، مواد)، وكل ملف داخلها صف، وكل ملف له **رقم فريد** (مفتاح أساسي). وفي ملف الطالب لا يُكتب وصف القسم كاملاً، بل **رقم القسم** فقط (مفتاح خارجي) يدلك على الخزانة الأخرى. والموظف المسؤول عن الأرشيف هو الـ DBMS.",mistakes:[{t:"استخدام الاسم كمفتاح أساسي",d:"الأسماء تتكرر وتتغير. استخدم رقماً فريداً لا يتغير."},{t:"تكرار البيانات في كل صف",d:"كتابة اسم القسم كاملاً لكل طالب يسبب تناقضات. افصله في جدول وارجع إليه بمفتاح خارجي."},{t:"الخلط بين DBMS وقاعدة البيانات",d:"قاعدة البيانات هي البيانات المنظمة، وDBMS هو البرنامج الذي يديرها (مثل SQLite)."}],summary:["المتغيرات مؤقتة في RAM؛ نحتاج تخزيناً دائماً.","الملفات النصية لا تكفي للتطبيقات الكبيرة.","قاعدة البيانا **SQL (Structured Query Language)** لغة قياسية للتعامل مع قواعد البيانات العلائقية. تُنطق "إس كيو إل" أو "سيكوِل". تختلف عن Python في أنها **تصريحية (Declarative)**: تصف **ماذا تريد** لا **كيف** تحصل عليه، والـ DBMS يقرر أسرع طريقة.

### CRUD: العمليات الأربع
كل تطبيق يتعامل مع بيانات يقوم بأربع عمليات أساسية، اختصارها **CRUD**:
| العملية | المعنى | جملة SQL |
|---|---|---|
| **C**reate | إنشاء / إضافة | \`INSERT\` |
| **R**ead | قراءة / بحث | \`SELECT\` |
| **U**pdate | تعديل | \`UPDATE\` |
| **D**elete | حذف | \`DELETE\` |

### إنشاء جدول
\`\`\`sql
CREATE TABLE students (
    id      INTEGER PRIMARY KEY,
    name    TEXT NOT NULL,
    dept_id INTEGER REFERENCES departments(id),
    stage   INTEGER,
    gpa     REAL CHECK (gpa BETWEEN 0 AND 100)
);
\`\`\`
القيود (Constraints): \`PRIMARY KEY\` فريد، \`NOT NULL\` إلزامي، \`REFERENCES\` مفتاح خارجي، \`CHECK\` شرط على القيم.

### Create: الإضافة
\`\`\`sql
INSERT INTO students (id, name, dept_id, stage, gpa)
VALUES (1005, 'Zainab Ali', 1, 1, 85.5);
\`\`\`
لاحظ: النصوص في SQL بين علامتي تنصيص **مفردتين**.

### Read: الاستعلام
\`\`\`sql
SELECT * FROM students;                          -- كل الأعمدة وكل الصفوف
SELECT name, gpa FROM students WHERE gpa >= 90;  -- أعمدة محددة بشرط
SELECT * FROM students ORDER BY gpa DESC;        -- مرتبة تنازلياً
SELECT * FROM students WHERE name LIKE '%Ali%';  -- يحتوي Ali
SELECT AVG(gpa), COUNT(*) FROM students;         -- دوال تجميع
\`\`\`
\`WHERE\` تشبه \`if\` في Python، وتدعم \`AND\` و\`OR\` و\`NOT\`.

### Update: التعديل
\`\`\`sql
UPDATE students SET gpa = 90 WHERE id = 1001;
\`\`\`

### Delete: الحذف
\`\`\`sql
DELETE FROM students WHERE id = 1003;
\`\`\`

> ⚠️ **أخطر خطأ في SQL**: نسيان \`WHERE\` في UPDATE أو DELETE. الجملة \`DELETE FROM students;\` **تحذف كل الطلاب**!

### ربط الجداول: JOIN
\`\`\`sql
SELECT students.name, departments.name
FROM students
JOIN departments ON students.dept_id = departments.id;
\`\`\`
يجمع كل طالب مع اسم قسمه عبر المفتاح الخارجي.
